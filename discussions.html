<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Discussions - CastroEduConnect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-gray-50 dark:bg-gray-900">
    <aside class="fixed left-0 top-0 h-full w-64 bg-white dark:bg-gray-800 shadow-xl z-50 transition-transform -translate-x-full md:translate-x-0" id="sidebar">
        <div class="p-6">
            <div class="flex items-center space-x-3 mb-8">
                <div class="w-10 h-10 gradient-bg rounded-xl flex items-center justify-center"><i class="fas fa-graduation-cap text-white text-xl"></i></div>
                <span class="text-xl font-bold text-gray-900 dark:text-white">CastroEduConnect</span>
            </div>
            <nav class="space-y-1">
                <a href="dashboard.html" class="sidebar-link"><i class="fas fa-th-large w-5"></i> Dashboard</a>
                <a href="subjects.html" class="sidebar-link"><i class="fas fa-book w-5"></i> Subjects</a>
                <a href="assignments.html" class="sidebar-link"><i class="fas fa-tasks w-5"></i> Assignments</a>
                <a href="assessments.html" class="sidebar-link"><i class="fas fa-question-circle w-5"></i> Assessments</a>
                <a href="results.html" class="sidebar-link"><i class="fas fa-chart-bar w-5"></i> Results</a>
                <a href="resources.html" class="sidebar-link"><i class="fas fa-folder w-5"></i> Resources</a>
                <a href="announcements.html" class="sidebar-link"><i class="fas fa-bullhorn w-5"></i> Announcements</a>
                <a href="discussions.html" class="sidebar-link active"><i class="fas fa-comments w-5"></i> Discussions</a>
                <a href="admin.html" class="sidebar-link"><i class="fas fa-user-shield w-5"></i> Admin Console</a>
                <a href="profile.html" class="sidebar-link"><i class="fas fa-user w-5"></i> Profile</a>
                <a href="settings.html" class="sidebar-link"><i class="fas fa-cog w-5"></i> Settings</a>
                <a href="#" onclick="logoutUser(); return false;" class="sidebar-link text-red-500 hover:text-red-600"><i class="fas fa-sign-out-alt w-5"></i> Logout</a>
            </nav>
        </div>
    </aside>

    <main class="md:ml-64 min-h-screen">
        <header class="bg-white dark:bg-gray-800 shadow-sm sticky top-0 z-40">
            <div class="flex items-center justify-between px-6 py-4">
                <button onclick="toggleSidebar()" class="md:hidden text-gray-600 dark:text-gray-300 text-2xl"><i class="fas fa-bars"></i></button>
                <div class="flex-1 max-w-xl mx-4"></div>
                <div class="flex items-center space-x-4">
                    <button id="dark-mode-toggle" class="text-gray-600 dark:text-gray-300 text-xl"><i id="dark-mode-icon" class="fas fa-moon"></i></button>
                    <div class="flex items-center space-x-3">
                        <div id="header-avatar" class="w-10 h-10 gradient-bg rounded-full flex items-center justify-center text-white font-semibold">--</div>
                        <div class="hidden sm:block">
                            <div id="header-name" class="text-sm font-semibold text-gray-900 dark:text-white">Loading...</div>
                            <div id="header-role" class="text-xs text-gray-500 dark:text-gray-400 capitalize">--</div>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <!-- LIST VIEW -->
        <div id="list-view" class="p-6">
            <div class="flex items-center justify-between mb-6 flex-wrap gap-4">
                <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Discussions</h1>
                <div class="flex items-center gap-3">
                    <select id="subject-filter" class="px-4 py-2 border border-gray-200 dark:border-gray-700 rounded-xl bg-white dark:bg-gray-800 text-gray-900 dark:text-white">
                        <option value="">All my subjects</option>
                    </select>
                    <button onclick="openNewDiscussionModal()" class="btn-primary px-6 py-2 rounded-xl text-white font-semibold"><i class="fas fa-plus mr-2"></i>New Discussion</button>
                </div>
            </div>

            <div id="discussions-list" class="space-y-4">
                <div class="skeleton rounded-2xl h-24"></div>
                <div class="skeleton rounded-2xl h-24"></div>
            </div>
            <div id="list-empty" class="hidden text-center py-16">
                <i class="fas fa-comments text-5xl text-gray-300 dark:text-gray-600 mb-4"></i>
                <p class="text-gray-500 dark:text-gray-400">No discussions yet. Start one!</p>
            </div>
        </div>

        <!-- THREAD VIEW -->
        <div id="thread-view" class="p-6 hidden">
            <button onclick="backToList()" class="text-blue-600 dark:text-blue-400 mb-4 font-medium"><i class="fas fa-arrow-left mr-2"></i>Back to Discussions</button>

            <div class="bg-white dark:bg-gray-800 rounded-2xl p-6 shadow-sm mb-6">
                <div class="flex items-start justify-between">
                    <div>
                        <div class="flex items-center gap-2 mb-2">
                            <span id="thread-pinned" class="hidden px-3 py-1 bg-gray-800 text-white text-xs font-semibold rounded-full"><i class="fas fa-thumbtack mr-1"></i>Pinned</span>
                            <span id="thread-subject" class="px-3 py-1 bg-blue-100 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 text-xs font-semibold rounded-full"></span>
                        </div>
                        <h2 id="thread-title" class="text-xl font-bold text-gray-900 dark:text-white"></h2>
                        <p id="thread-meta" class="text-sm text-gray-500 dark:text-gray-400 mt-1"></p>
                    </div>
                    <div id="thread-mod-actions" class="hidden flex gap-2">
                        <button onclick="togglePin()" title="Pin/unpin" class="w-9 h-9 rounded-lg bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-200"><i class="fas fa-thumbtack"></i></button>
                        <button onclick="toggleClose()" title="Close/reopen" class="w-9 h-9 rounded-lg bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-200"><i class="fas fa-lock"></i></button>
                    </div>
                </div>
                <p id="thread-content" class="text-gray-700 dark:text-gray-300 mt-4 whitespace-pre-line"></p>
            </div>

            <div class="bg-white dark:bg-gray-800 rounded-2xl p-6 shadow-sm">
                <h3 class="text-lg font-semibold text-gray-900 dark:text-white mb-4"><i class="fas fa-comment-dots mr-2"></i>Replies</h3>
                <div id="comments-list" class="space-y-4 mb-6"></div>
                <div id="reply-box" class="flex gap-3">
                    <textarea id="reply-input" rows="2" placeholder="Write a reply..." class="flex-1 px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-blue-500 bg-white dark:bg-gray-700 text-gray-900 dark:text-white resize-none"></textarea>
                    <button onclick="postReply()" class="btn-primary px-6 rounded-xl text-white font-semibold self-end h-12"><i class="fas fa-paper-plane"></i></button>
                </div>
                <p id="closed-notice" class="hidden text-sm text-gray-500 dark:text-gray-400 italic">This discussion is closed for new replies.</p>
            </div>
        </div>
    </main>

    <!-- New Discussion Modal -->
    <div id="new-discussion-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="flex items-center justify-between mb-6">
                <h3 class="text-xl font-bold text-gray-900 dark:text-white">Start a Discussion</h3>
                <button onclick="closeNewDiscussionModal()" class="text-gray-400 hover:text-gray-600"><i class="fas fa-times text-xl"></i></button>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Subject</label>
                    <select id="new-disc-subject" class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-blue-500 bg-white dark:bg-gray-700 text-gray-900 dark:text-white"></select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Title</label>
                    <input id="new-disc-title" type="text" class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-blue-500 bg-white dark:bg-gray-700 text-gray-900 dark:text-white" />
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">What's on your mind?</label>
                    <textarea id="new-disc-content" rows="4" class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-blue-500 bg-white dark:bg-gray-700 text-gray-900 dark:text-white resize-none"></textarea>
                </div>
                <button onclick="submitNewDiscussion()" class="w-full btn-primary py-3 rounded-xl text-white font-semibold"><i class="fas fa-paper-plane mr-2"></i>Post Discussion</button>
            </div>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script>
        const SUPABASE_URL = 'https://kfeqmjveemfacrmqrhzk.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_p5OiC1XnOlBLKs2nUYAL1w_LBBh5kDo';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let userProfile = null;
        let mySubjects = [];
        let currentDiscussion = null;

        function showToast(message, type = 'info', duration = 3000) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.innerHTML = `<div class="flex items-center justify-between"><span>${message}</span><button onclick="this.parentElement.parentElement.remove()" class="ml-4 text-white/80 hover:text-white"><i class="fas fa-times"></i></button></div>`;
            container.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; toast.style.transform = 'translateX(100%)'; toast.style.transition = 'all 0.3s ease'; setTimeout(() => toast.remove(), 300); }, duration);
        }
        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('-translate-x-full'); }
        async function logoutUser() { await supabaseClient.auth.signOut(); window.location.href = 'login.html'; }
        function initials(first, last) { return `${(first || '?')[0] || ''}${(last || '')[0] || ''}`.toUpperCase() || '?'; }
        function escapeHtml(str) { const div = document.createElement('div'); div.textContent = str || ''; return div.innerHTML; }
        function timeAgo(dateStr) {
            const diff = (Date.now() - new Date(dateStr).getTime()) / 1000;
            if (diff < 60) return 'Just now';
            if (diff < 3600) return `${Math.floor(diff/60)}m ago`;
            if (diff < 86400) return `${Math.floor(diff/3600)}h ago`;
            return `${Math.floor(diff/86400)}d ago`;
        }

        async function checkAuth() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) { window.location.href = 'login.html'; return null; }
            currentUser = session.user;
            const { data, error } = await supabaseClient.from('profiles').select('*').eq('id', currentUser.id).single();
            if (error) { showToast('Could not load your profile', 'error'); return null; }
            userProfile = data;
            document.getElementById('header-name').textContent = `${data.first_name || ''} ${data.last_name || ''}`.trim() || data.email;
            document.getElementById('header-role').textContent = data.role;
            document.getElementById('header-avatar').textContent = initials(data.first_name, data.last_name);
            return data;
        }

        function isModerator() {
            return userProfile && (userProfile.role === 'admin' || userProfile.role === 'teacher');
        }

        async function loadMySubjects() {
            try {
                let subjects = [];
                if (userProfile.role === 'teacher') {
                    const { data } = await supabaseClient.from('subjects').select('id, name, color').eq('teacher_id', currentUser.id);
                    subjects = data || [];
                } else if (userProfile.role === 'admin') {
                    const { data } = await supabaseClient.from('subjects').select('id, name, color');
                    subjects = data || [];
                } else {
                    const { data } = await supabaseClient
                        .from('subject_enrollments')
                        .select('subjects(id, name, color)')
                        .eq('learner_id', currentUser.id)
                        .eq('status', 'active');
                    subjects = (data || []).map(e => e.subjects).filter(Boolean);
                }
                mySubjects = subjects;
                const filterSel = document.getElementById('subject-filter');
                const newSel = document.getElementById('new-disc-subject');
                filterSel.innerHTML = '<option value="">All my subjects</option>' + subjects.map(s => `<option value="${s.id}">${escapeHtml(s.name)}</option>`).join('');
                newSel.innerHTML = subjects.length
                    ? subjects.map(s => `<option value="${s.id}">${escapeHtml(s.name)}</option>`).join('')
                    : '<option value="">Enroll in a subject first</option>';
            } catch (e) {
                console.error(e);
            }
        }

        async function loadDiscussions() {
            const subjectId = document.getElementById('subject-filter').value;
            const list = document.getElementById('discussions-list');
            const empty = document.getElementById('list-empty');
            list.innerHTML = '<div class="skeleton rounded-2xl h-24"></div><div class="skeleton rounded-2xl h-24"></div>';
            empty.classList.add('hidden');
            try {
                const subjectIds = subjectId ? [subjectId] : mySubjects.map(s => s.id);
                if (!subjectIds.length) {
                    list.innerHTML = '';
                    empty.classList.remove('hidden');
                    return;
                }
                const { data, error } = await supabaseClient
                    .from('discussions')
                    .select('*, subjects(name, color), profiles:author_id(first_name, last_name), discussion_comments(count)')
                    .in('subject_id', subjectIds)
                    .order('is_pinned', { ascending: false })
                    .order('created_at', { ascending: false });
                if (error) throw error;
                if (!data || !data.length) {
                    list.innerHTML = '';
                    empty.classList.remove('hidden');
                    return;
                }
                list.innerHTML = data.map(d => {
                    const authorName = d.profiles ? `${d.profiles.first_name || ''} ${d.profiles.last_name || ''}`.trim() : 'Unknown';
                    const replyCount = d.discussion_comments?.[0]?.count ?? 0;
                    return `
                    <div onclick="openThread('${d.id}')" class="bg-white dark:bg-gray-800 rounded-2xl p-5 shadow-sm cursor-pointer hover:shadow-md transition">
                        <div class="flex items-center gap-2 mb-2 flex-wrap">
                            ${d.is_pinned ? '<span class="px-2 py-0.5 bg-gray-800 text-white text-xs font-semibold rounded-full"><i class="fas fa-thumbtack mr-1"></i>Pinned</span>' : ''}
                            ${d.is_closed ? '<span class="px-2 py-0.5 bg-red-100 text-red-600 text-xs font-semibold rounded-full">Closed</span>' : ''}
                            <span class="px-2 py-0.5 bg-blue-100 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 text-xs font-semibold rounded-full">${escapeHtml(d.subjects?.name || '')}</span>
                        </div>
                        <h3 class="font-bold text-gray-900 dark:text-white">${escapeHtml(d.title)}</h3>
                        <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">by ${escapeHtml(authorName)} &middot; ${timeAgo(d.created_at)} &middot; <i class="fas fa-comment mr-1"></i>${replyCount} replies</p>
                    </div>`;
                }).join('');
            } catch (e) {
                console.error(e);
                showToast('Could not load discussions', 'error');
            }
        }
        document.getElementById('subject-filter').addEventListener('change', loadDiscussions);

        function openNewDiscussionModal() {
            if (!mySubjects.length) { showToast('Enroll in a subject first', 'warning'); return; }
            document.getElementById('new-discussion-modal').classList.add('active');
        }
        function closeNewDiscussionModal() {
            document.getElementById('new-discussion-modal').classList.remove('active');
            document.getElementById('new-disc-title').value = '';
            document.getElementById('new-disc-content').value = '';
        }
        async function submitNewDiscussion() {
            const subjectId = document.getElementById('new-disc-subject').value;
            const title = document.getElementById('new-disc-title').value.trim();
            const content = document.getElementById('new-disc-content').value.trim();
            if (!subjectId || !title) { showToast('Please choose a subject and title', 'error'); return; }
            try {
                const { error } = await supabaseClient.from('discussions').insert([{
                    subject_id: subjectId, author_id: currentUser.id, title, content
                }]);
                if (error) throw error;
                showToast('Discussion posted!', 'success');
                closeNewDiscussionModal();
                await loadDiscussions();
            } catch (e) {
                showToast('Could not post: ' + e.message, 'error');
            }
        }

        async function openThread(id) {
            try {
                const { data, error } = await supabaseClient
                    .from('discussions')
                    .select('*, subjects(name), profiles:author_id(first_name, last_name)')
                    .eq('id', id).single();
                if (error) throw error;
                currentDiscussion = data;
                document.getElementById('list-view').classList.add('hidden');
                document.getElementById('thread-view').classList.remove('hidden');
                renderThreadHeader();
                await loadComments();
            } catch (e) {
                showToast('Could not open discussion', 'error');
            }
        }
        function backToList() {
            document.getElementById('thread-view').classList.add('hidden');
            document.getElementById('list-view').classList.remove('hidden');
            currentDiscussion = null;
        }

        function renderThreadHeader() {
            const d = currentDiscussion;
            const authorName = d.profiles ? `${d.profiles.first_name || ''} ${d.profiles.last_name || ''}`.trim() : 'Unknown';
            document.getElementById('thread-pinned').classList.toggle('hidden', !d.is_pinned);
            document.getElementById('thread-subject').textContent = d.subjects?.name || '';
            document.getElementById('thread-title').textContent = d.title;
            document.getElementById('thread-meta').textContent = `by ${authorName} · ${timeAgo(d.created_at)}`;
            document.getElementById('thread-content').textContent = d.content || '';
            const canModerate = isModerator() || d.author_id === currentUser.id;
            document.getElementById('thread-mod-actions').classList.toggle('hidden', !canModerate);
            document.getElementById('reply-box').classList.toggle('hidden', !!d.is_closed);
            document.getElementById('closed-notice').classList.toggle('hidden', !d.is_closed);
        }

        async function togglePin() {
            const { error } = await supabaseClient.from('discussions').update({ is_pinned: !currentDiscussion.is_pinned }).eq('id', currentDiscussion.id);
            if (error) { showToast('Could not update: ' + error.message, 'error'); return; }
            currentDiscussion.is_pinned = !currentDiscussion.is_pinned;
            renderThreadHeader();
            showToast(currentDiscussion.is_pinned ? 'Pinned' : 'Unpinned', 'success');
        }
        async function toggleClose() {
            const { error } = await supabaseClient.from('discussions').update({ is_closed: !currentDiscussion.is_closed }).eq('id', currentDiscussion.id);
            if (error) { showToast('Could not update: ' + error.message, 'error'); return; }
            currentDiscussion.is_closed = !currentDiscussion.is_closed;
            renderThreadHeader();
            showToast(currentDiscussion.is_closed ? 'Closed' : 'Reopened', 'success');
        }

        async function loadComments() {
            const container = document.getElementById('comments-list');
            container.innerHTML = '<div class="skeleton rounded-xl h-16"></div>';
            try {
                const { data, error } = await supabaseClient
                    .from('discussion_comments')
                    .select('*, profiles:user_id(first_name, last_name, role)')
                    .eq('discussion_id', currentDiscussion.id)
                    .order('created_at', { ascending: true });
                if (error) throw error;
                if (!data || !data.length) {
                    container.innerHTML = '<p class="text-gray-500 dark:text-gray-400 text-sm">No replies yet — be the first!</p>';
                    return;
                }
                const canMark = isModerator();
                container.innerHTML = data.map(c => {
                    const name = c.profiles ? `${c.profiles.first_name || ''} ${c.profiles.last_name || ''}`.trim() : 'Unknown';
                    const roleTag = c.profiles?.role === 'teacher' ? '<span class="text-xs px-2 py-0.5 bg-purple-100 text-purple-600 rounded-full ml-2">Teacher</span>' : '';
                    return `
                    <div class="flex gap-3 p-4 rounded-xl ${c.is_best_answer ? 'bg-green-50 dark:bg-green-900/20 border border-green-300 dark:border-green-700' : 'bg-gray-50 dark:bg-gray-900/50'}">
                        <div class="w-9 h-9 rounded-full gradient-bg flex items-center justify-center text-white text-xs font-semibold flex-shrink-0">${initials(c.profiles?.first_name, c.profiles?.last_name)}</div>
                        <div class="flex-1">
                            <div class="flex items-center justify-between flex-wrap gap-1">
                                <p class="text-sm font-semibold text-gray-900 dark:text-white">${escapeHtml(name)}${roleTag} ${c.is_best_answer ? '<span class="text-xs px-2 py-0.5 bg-green-600 text-white rounded-full ml-2"><i class="fas fa-check mr-1"></i>Best Answer</span>' : ''}</p>
                                <span class="text-xs text-gray-400">${timeAgo(c.created_at)}</span>
                            </div>
                            <p class="text-gray-700 dark:text-gray-300 mt-1 whitespace-pre-line">${escapeHtml(c.content)}</p>
                            <div class="flex items-center gap-4 mt-2">
                                <button onclick="upvote('${c.id}', ${c.upvotes || 0})" class="text-xs text-gray-500 dark:text-gray-400 hover:text-blue-600"><i class="fas fa-arrow-up mr-1"></i>${c.upvotes || 0}</button>
                                ${canMark && !c.is_best_answer ? `<button onclick="markBest('${c.id}')" class="text-xs text-gray-500 dark:text-gray-400 hover:text-green-600"><i class="fas fa-check-circle mr-1"></i>Mark as best</button>` : ''}
                            </div>
                        </div>
                    </div>`;
                }).join('');
            } catch (e) {
                console.error(e);
                container.innerHTML = '<p class="text-red-500 text-sm">Could not load replies.</p>';
            }
        }

        async function postReply() {
            const content = document.getElementById('reply-input').value.trim();
            if (!content) return;
            try {
                const { error } = await supabaseClient.from('discussion_comments').insert([{
                    discussion_id: currentDiscussion.id, user_id: currentUser.id, content
                }]);
                if (error) throw error;
                document.getElementById('reply-input').value = '';
                await loadComments();
            } catch (e) {
                showToast('Could not reply: ' + e.message, 'error');
            }
        }
        async function upvote(commentId, current) {
            const { error } = await supabaseClient.from('discussion_comments').update({ upvotes: current + 1 }).eq('id', commentId);
            if (!error) await loadComments();
        }
        async function markBest(commentId) {
            try {
                await supabaseClient.from('discussion_comments').update({ is_best_answer: false }).eq('discussion_id', currentDiscussion.id);
                const { error } = await supabaseClient.from('discussion_comments').update({ is_best_answer: true }).eq('id', commentId);
                if (error) throw error;
                showToast('Marked as best answer', 'success');
                await loadComments();
            } catch (e) {
                showToast('Could not mark: ' + e.message, 'error');
            }
        }

        function initDarkMode() {
            const saved = localStorage.getItem('darkMode');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const isDark = saved ? saved === 'true' : prefersDark;
            if (isDark) { document.documentElement.classList.add('dark'); document.getElementById('dark-mode-icon').className = 'fas fa-sun'; }
        }
        document.getElementById('dark-mode-toggle')?.addEventListener('click', () => {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('darkMode', isDark ? 'true' : 'false');
            document.getElementById('dark-mode-icon').className = isDark ? 'fas fa-sun' : 'fas fa-moon';
        });

        (async function init() {
            initDarkMode();
            const p = await checkAuth();
            if (!p) return;
            await loadMySubjects();
            await loadDiscussions();
        })();
    </script>
