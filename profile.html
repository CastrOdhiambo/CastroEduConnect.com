<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile - CastroEduConnect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-gray-50 dark:bg-gray-900">
    <aside class="fixed left-0 top-0 h-full w-64 bg-white dark:bg-gray-800 shadow-xl z-50 transition-transform -translate-x-full md:translate-x-0" id="sidebar">
        <div class="p-6">
            <div class="flex items-center space-x-3 mb-8">
                <div class="w-10 h-10 gradient-bg rounded-xl flex items-center justify-center"><i class="fas fa-graduation-cap text-white text-xl"></i></div>
                <span class="text-xl font-bold text-gray-900 dark:text-white">CastroEduConnect</span>
            </div>
            <nav class="space-y-1">
                <a href="dashboard.html" class="sidebar-link"><i class="fas fa-th-large w-5"></i> Dashboard</a>
                <a href="subjects.html" class="sidebar-link"><i class="fas fa-book w-5"></i> Subjects</a>
                <a href="assignments.html" class="sidebar-link"><i class="fas fa-tasks w-5"></i> Assignments</a>
                <a href="assessments.html" class="sidebar-link"><i class="fas fa-question-circle w-5"></i> Assessments</a>
                <a href="results.html" class="sidebar-link"><i class="fas fa-chart-bar w-5"></i> Results</a>
                <a href="resources.html" class="sidebar-link"><i class="fas fa-folder w-5"></i> Resources</a>
                <a href="announcements.html" class="sidebar-link"><i class="fas fa-bullhorn w-5"></i> Announcements</a>
                <a href="discussions.html" class="sidebar-link"><i class="fas fa-comments w-5"></i> Discussions</a>
                <a href="admin.html" class="sidebar-link"><i class="fas fa-user-shield w-5"></i> Admin Console</a>
                <a href="profile.html" class="sidebar-link active"><i class="fas fa-user w-5"></i> Profile</a>
                <a href="settings.html" class="sidebar-link"><i class="fas fa-cog w-5"></i> Settings</a>
                <a href="#" onclick="logoutUser(); return false;" class="sidebar-link text-red-500 hover:text-red-600"><i class="fas fa-sign-out-alt w-5"></i> Logout</a>
            </nav>
        </div>
    </aside>

    <main class="md:ml-64 min-h-screen">
        <header class="bg-white dark:bg-gray-800 shadow-sm sticky top-0 z-40">
            <div class="flex items-center justify-between px-6 py-4">
                <button onclick="toggleSidebar()" class="md:hidden text-gray-600 dark:text-gray-300 text-2xl"><i class="fas fa-bars"></i></button>
                <div class="flex-1 max-w-xl mx-4"></div>
                <div class="flex items-center space-x-4">
                    <button id="dark-mode-toggle" class="text-gray-600 dark:text-gray-300 text-xl"><i id="dark-mode-icon" class="fas fa-moon"></i></button>
                    <div class="flex items-center space-x-3">
                        <div id="header-avatar" class="w-10 h-10 gradient-bg rounded-full flex items-center justify-center text-white font-semibold">--</div>
                        <div class="hidden sm:block">
                            <div id="header-name" class="text-sm font-semibold text-gray-900 dark:text-white">Loading...</div>
                            <div id="header-role" class="text-xs text-gray-500 dark:text-gray-400 capitalize">--</div>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <div class="p-6">
            <div class="max-w-3xl mx-auto">
                <div class="bg-white dark:bg-gray-800 rounded-3xl shadow-sm overflow-hidden">
                    <div class="gradient-bg h-32"></div>
                    <div class="relative px-6 pb-6">
                        <div class="flex justify-center -mt-16 mb-4">
                            <div id="profile-avatar-big" class="w-32 h-32 rounded-full border-4 border-white dark:border-gray-800 overflow-hidden bg-gray-200 dark:bg-gray-700 flex items-center justify-center text-4xl font-bold text-gray-500 dark:text-gray-300">
                                <i class="fas fa-user text-6xl text-gray-400 dark:text-gray-500"></i>
                            </div>
                        </div>
                        <div class="text-center">
                            <h2 id="profile-name" class="text-2xl font-bold text-gray-900 dark:text-white">Loading...</h2>
                            <p id="profile-email" class="text-gray-500 dark:text-gray-400">--</p>
                            <span id="profile-role-badge" class="inline-block mt-2 px-4 py-1 bg-blue-100 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 rounded-full text-sm font-medium capitalize">--</span>
                        </div>

                        <div class="grid md:grid-cols-3 gap-4 mt-6">
                            <div class="text-center p-4 bg-gray-50 dark:bg-gray-900/50 rounded-xl">
                                <div id="stat-subjects" class="text-lg font-bold text-gray-900 dark:text-white">--</div>
                                <div class="text-sm text-gray-500 dark:text-gray-400">Enrolled Subjects</div>
                            </div>
                            <div class="text-center p-4 bg-gray-50 dark:bg-gray-900/50 rounded-xl">
                                <div id="stat-average" class="text-lg font-bold text-gray-900 dark:text-white">--</div>
                                <div class="text-sm text-gray-500 dark:text-gray-400">Average Score</div>
                            </div>
                            <div class="text-center p-4 bg-gray-50 dark:bg-gray-900/50 rounded-xl">
                                <div id="stat-completed" class="text-lg font-bold text-gray-900 dark:text-white">--</div>
                                <div class="text-sm text-gray-500 dark:text-gray-400">Completed</div>
                            </div>
                        </div>

                        <div class="mt-8">
                            <div class="flex items-center justify-between mb-4">
                                <h3 class="text-lg font-semibold text-gray-900 dark:text-white">Profile Information</h3>
                                <button id="edit-toggle-btn" onclick="toggleEditMode()" class="text-blue-600 dark:text-blue-400 text-sm font-medium hover:underline"><i class="fas fa-edit mr-1"></i>Edit</button>
                            </div>

                            <form id="profile-form" class="space-y-4">
                                <div class="grid sm:grid-cols-2 gap-4">
                                    <div class="p-4 bg-gray-50 dark:bg-gray-900/50 rounded-xl">
                                        <label class="text-sm text-gray-500 dark:text-gray-400 block mb-1">First Name</label>
                                        <input id="input-first-name" disabled type="text" class="w-full bg-transparent text-gray-900 dark:text-white font-medium border-0 p-0 focus:ring-0 disabled:opacity-100" />
                                    </div>
                                    <div class="p-4 bg-gray-50 dark:bg-gray-900/50 rounded-xl">
                                        <label class="text-sm text-gray-500 dark:text-gray-400 block mb-1">Last Name</label>
                                        <input id="input-last-name" disabled type="text" class="w-full bg-transparent text-gray-900 dark:text-white font-medium border-0 p-0 focus:ring-0 disabled:opacity-100" />
                                    </div>
                                </div>
                                <div class="p-4 bg-gray-50 dark:bg-gray-900/50 rounded-xl">
                                    <label class="text-sm text-gray-500 dark:text-gray-400 block mb-1"><i class="fas fa-envelope text-blue-600 dark:text-blue-400 mr-1"></i>Email</label>
                                    <input id="input-email" disabled type="email" class="w-full bg-transparent text-gray-900 dark:text-white font-medium border-0 p-0 focus:ring-0 disabled:opacity-100" />
                                </div>
                                <div class="grid sm:grid-cols-2 gap-4">
                                    <div class="p-4 bg-gray-50 dark:bg-gray-900/50 rounded-xl">
                                        <label class="text-sm text-gray-500 dark:text-gray-400 block mb-1"><i class="fas fa-phone text-blue-600 dark:text-blue-400 mr-1"></i>Phone</label>
                                        <input id="input-phone" disabled type="text" placeholder="Not set" class="w-full bg-transparent text-gray-900 dark:text-white font-medium border-0 p-0 focus:ring-0 disabled:opacity-100" />
                                    </div>
                                    <div class="p-4 bg-gray-50 dark:bg-gray-900/50 rounded-xl">
                                        <label class="text-sm text-gray-500 dark:text-gray-400 block mb-1"><i class="fas fa-map-marker-alt text-blue-600 dark:text-blue-400 mr-1"></i>City</label>
                                        <input id="input-city" disabled type="text" placeholder="Not set" class="w-full bg-transparent text-gray-900 dark:text-white font-medium border-0 p-0 focus:ring-0 disabled:opacity-100" />
                                    </div>
                                </div>
                                <div class="p-4 bg-gray-50 dark:bg-gray-900/50 rounded-xl">
                                    <label class="text-sm text-gray-500 dark:text-gray-400 block mb-1"><i class="fas fa-quote-left text-blue-600 dark:text-blue-400 mr-1"></i>Bio</label>
                                    <textarea id="input-bio" disabled rows="3" placeholder="Tell us about yourself..." class="w-full bg-transparent text-gray-900 dark:text-white font-medium border-0 p-0 focus:ring-0 disabled:opacity-100 resize-none"></textarea>
                                </div>
                            </form>

                            <div id="edit-actions" class="mt-6 hidden space-x-4">
                                <button onclick="saveProfile()" class="flex-1 btn-primary py-3 rounded-xl text-white font-semibold"><i class="fas fa-save mr-2"></i>Save Changes</button>
                                <button onclick="toggleEditMode()" class="flex-1 bg-gray-200 dark:bg-gray-700 py-3 rounded-xl text-gray-700 dark:text-gray-300 font-semibold hover:bg-gray-300 dark:hover:bg-gray-600 transition">Cancel</button>
                            </div>
                            <div id="view-actions" class="mt-6 flex space-x-4">
                                <button onclick="toggleEditMode()" class="flex-1 btn-primary py-3 rounded-xl text-white font-semibold"><i class="fas fa-edit mr-2"></i>Edit Profile</button>
                                <button onclick="openPasswordModal()" class="flex-1 bg-gray-200 dark:bg-gray-700 py-3 rounded-xl text-gray-700 dark:text-gray-300 font-semibold hover:bg-gray-300 dark:hover:bg-gray-600 transition"><i class="fas fa-key mr-2"></i>Change Password</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Change Password Modal -->
    <div id="password-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="flex items-center justify-between mb-6">
                <h3 class="text-xl font-bold text-gray-900 dark:text-white">Change Password</h3>
                <button onclick="closePasswordModal()" class="text-gray-400 hover:text-gray-600"><i class="fas fa-times text-xl"></i></button>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">New Password</label>
                    <input id="new-password" type="password" placeholder="At least 8 characters" class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-blue-500 bg-white dark:bg-gray-700 text-gray-900 dark:text-white" />
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Confirm New Password</label>
                    <input id="confirm-new-password" type="password" placeholder="Repeat password" class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-blue-500 bg-white dark:bg-gray-700 text-gray-900 dark:text-white" />
                </div>
                <button onclick="submitPasswordChange()" class="w-full btn-primary py-3 rounded-xl text-white font-semibold"><i class="fas fa-key mr-2"></i>Update Password</button>
            </div>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script>
        // ============================================
        // SUPABASE CONFIGURATION
        // ============================================
        const SUPABASE_URL = 'https://kfeqmjveemfacrmqrhzk.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_p5OiC1XnOlBLKs2nUYAL1w_LBBh5kDo';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let userProfile = null;

        function showToast(message, type = 'info', duration = 3000) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.innerHTML = `<div class="flex items-center justify-between"><span>${message}</span><button onclick="this.parentElement.parentElement.remove()" class="ml-4 text-white/80 hover:text-white"><i class="fas fa-times"></i></button></div>`;
            container.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; toast.style.transform = 'translateX(100%)'; toast.style.transition = 'all 0.3s ease'; setTimeout(() => toast.remove(), 300); }, duration);
        }

        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('-translate-x-full'); }

        async function logoutUser() {
            await supabaseClient.auth.signOut();
            window.location.href = 'login.html';
        }

        function initials(first, last) {
            return `${(first || '?')[0] || ''}${(last || '')[0] || ''}`.toUpperCase() || '?';
        }

        async function checkAuth() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) { window.location.href = 'login.html'; return null; }
            currentUser = session.user;
            const { data, error } = await supabaseClient.from('profiles').select('*').eq('id', currentUser.id).single();
            if (error) { console.error(error); showToast('Could not load your profile', 'error'); return null; }
            userProfile = data;
            return data;
        }

        function renderProfile() {
            const p = userProfile;
            const name = `${p.first_name || ''} ${p.last_name || ''}`.trim() || p.email;
            document.getElementById('header-name').textContent = name;
            document.getElementById('header-role').textContent = p.role;
            document.getElementById('header-avatar').textContent = initials(p.first_name, p.last_name);
            document.getElementById('profile-avatar-big').textContent = initials(p.first_name, p.last_name);
            document.getElementById('profile-name').textContent = name;
            document.getElementById('profile-email').textContent = p.email;
            document.getElementById('profile-role-badge').textContent = p.role;

            document.getElementById('input-first-name').value = p.first_name || '';
            document.getElementById('input-last-name').value = p.last_name || '';
            document.getElementById('input-email').value = p.email || '';
            document.getElementById('input-phone').value = p.phone || '';
            document.getElementById('input-city').value = p.city || '';
            document.getElementById('input-bio').value = p.bio || '';
        }

        async function loadStats() {
            try {
                const { count: subjectCount } = await supabaseClient
                    .from('subject_enrollments').select('*', { count: 'exact', head: true })
                    .eq('learner_id', currentUser.id).eq('status', 'active');
                document.getElementById('stat-subjects').textContent = subjectCount ?? 0;

                const { data: submissions } = await supabaseClient
                    .from('submissions').select('percentage, status')
                    .eq('learner_id', currentUser.id);

                const graded = (submissions || []).filter(s => s.status === 'graded' && s.percentage != null);
                const avg = graded.length ? (graded.reduce((sum, s) => sum + Number(s.percentage), 0) / graded.length) : 0;
                document.getElementById('stat-average').textContent = graded.length ? `${avg.toFixed(0)}%` : '--';
                document.getElementById('stat-completed').textContent = (submissions || []).filter(s => s.status === 'graded' || s.status === 'submitted').length;
            } catch (e) {
                console.error('Stats error:', e);
            }
        }

        function toggleEditMode() {
            const inputs = ['input-first-name', 'input-last-name', 'input-phone', 'input-city', 'input-bio'];
            const editing = document.getElementById('edit-actions').classList.contains('hidden');
            inputs.forEach(id => document.getElementById(id).disabled = !editing);
            document.getElementById('edit-actions').classList.toggle('hidden', !editing);
            document.getElementById('view-actions').classList.toggle('hidden', editing);
            if (!editing) renderProfile(); // reset on cancel
        }

        async function saveProfile() {
            const updates = {
                first_name: document.getElementById('input-first-name').value.trim(),
                last_name: document.getElementById('input-last-name').value.trim(),
                phone: document.getElementById('input-phone').value.trim(),
                city: document.getElementById('input-city').value.trim(),
                bio: document.getElementById('input-bio').value.trim(),
            };
            if (!updates.first_name || !updates.last_name) {
                showToast('First and last name are required', 'error');
                return;
            }
            try {
                const { error } = await supabaseClient.from('profiles').update(updates).eq('id', currentUser.id);
                if (error) throw error;
                userProfile = { ...userProfile, ...updates };
                renderProfile();
                toggleEditMode();
                showToast('Profile updated successfully!', 'success');
            } catch (e) {
                console.error(e);
                showToast('Could not save profile: ' + e.message, 'error');
            }
        }

        function openPasswordModal() { document.getElementById('password-modal').classList.add('active'); }
        function closePasswordModal() {
            document.getElementById('password-modal').classList.remove('active');
            document.getElementById('new-password').value = '';
            document.getElementById('confirm-new-password').value = '';
        }
        async function submitPasswordChange() {
            const pw = document.getElementById('new-password').value;
            const confirm = document.getElementById('confirm-new-password').value;
            if (pw.length < 8) { showToast('Password must be at least 8 characters', 'error'); return; }
            if (pw !== confirm) { showToast('Passwords do not match', 'error'); return; }
            try {
                const { error } = await supabaseClient.auth.updateUser({ password: pw });
                if (error) throw error;
                showToast('Password updated successfully!', 'success');
                closePasswordModal();
            } catch (e) {
                showToast('Could not update password: ' + e.message, 'error');
            }
        }

        function initDarkMode() {
            const saved = localStorage.getItem('darkMode');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const isDark = saved ? saved === 'true' : prefersDark;
            if (isDark) { document.documentElement.classList.add('dark'); document.getElementById('dark-mode-icon').className = 'fas fa-sun'; }
        }
        document.getElementById('dark-mode-toggle')?.addEventListener('click', () => {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('darkMode', isDark ? 'true' : 'false');
            document.getElementById('dark-mode-icon').className = isDark ? 'fas fa-sun' : 'fas fa-moon';
        });

        (async function init() {
            initDarkMode();
            const p = await checkAuth();
            if (!p) return;
            renderProfile();
            await loadStats();
        })();
    </script>
</body>
</html>
