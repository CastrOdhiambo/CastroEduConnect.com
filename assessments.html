<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assessments - CastroEduConnect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        .sidebar-link {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            color: #6b7280;
            transition: all 0.3s ease;
            cursor: pointer;
            text-decoration: none;
        }
        .sidebar-link:hover {
            background: rgba(37, 99, 235, 0.1);
            color: #2563EB;
        }
        .sidebar-link.active {
            background: linear-gradient(135deg, #2563EB, #4F46E5);
            color: white;
        }
        .dark .sidebar-link {
            color: #9ca3af;
        }
        .dark .sidebar-link:hover {
            background: rgba(37, 99, 235, 0.2);
            color: #60a5fa;
        }
        
        .gradient-bg {
            background: linear-gradient(135deg, #2563EB 0%, #4F46E5 50%, #7C3AED 100%);
        }
        
        .spinner {
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .toast-container {
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .toast {
            padding: 1rem 1.5rem;
            border-radius: 0.75rem;
            color: white;
            animation: slideInRight 0.5s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            min-width: 300px;
            max-width: 450px;
        }
        .toast-success { background: #10B981; }
        .toast-error { background: #EF4444; }
        .toast-warning { background: #F59E0B; }
        .toast-info { background: #3B82F6; }
        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 9998;
            display: none;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-content {
            background: white;
            border-radius: 2rem;
            padding: 2rem;
            max-width: 700px;
            width: 95%;
            max-height: 90vh;
            overflow-y: auto;
            animation: modalPop 0.3s ease;
        }
        .dark .modal-content {
            background: #1a1a2e;
        }
        @keyframes modalPop {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        
        .status-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            display: inline-block;
        }
        .status-draft { background: #E5E7EB; color: #6B7280; }
        .status-published { background: #DBEAFE; color: #2563EB; }
        .status-active { background: #D1FAE5; color: #059669; }
        .status-closed { background: #FEE2E2; color: #DC2626; }
        .status-archived { background: #F3F4F6; color: #9CA3AF; }
        .dark .status-draft { background: #374151; color: #9CA3AF; }
        .dark .status-published { background: #1E3A5F; color: #60A5FA; }
        .dark .status-active { background: #065F46; color: #34D399; }
        .dark .status-closed { background: #7F1D1D; color: #F87171; }
        .dark .status-archived { background: #1F2937; color: #6B7280; }
        
        .type-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.7rem;
            font-weight: 600;
            display: inline-block;
        }
        .type-assignment { background: #DBEAFE; color: #2563EB; }
        .type-quiz { background: #FEF3C7; color: #D97706; }
        .type-cat { background: #D1FAE5; color: #059669; }
        .type-exam { background: #FEE2E2; color: #DC2626; }
        .dark .type-assignment { background: #1E3A5F; color: #60A5FA; }
        .dark .type-quiz { background: #78350F; color: #FBBF24; }
        .dark .type-cat { background: #065F46; color: #34D399; }
        .dark .type-exam { background: #7F1D1D; color: #F87171; }
        
        .table-container {
            overflow-x: auto;
            border-radius: 1.5rem;
            background: white;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }
        .dark .table-container {
            background: #1a1a2e;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        thead {
            background: #F9FAFB;
            border-bottom: 2px solid #E5E7EB;
        }
        .dark thead {
            background: #111827;
            border-bottom: 2px solid #374151;
        }
        th {
            padding: 0.75rem 1rem;
            text-align: left;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #6B7280;
        }
        .dark th {
            color: #9CA3AF;
        }
        td {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid #F3F4F6;
            font-size: 0.875rem;
        }
        .dark td {
            border-bottom: 1px solid #374151;
        }
        tbody tr {
            transition: background-color 0.2s ease;
        }
        tbody tr:hover {
            background: #F9FAFB;
        }
        .dark tbody tr:hover {
            background: #1F2937;
        }
        
        .skeleton-row td {
            padding: 0.75rem 1rem;
        }
        .skeleton-row .skeleton {
            height: 20px;
            border-radius: 0.5rem;
        }
        
        .pagination {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem;
            border-top: 1px solid #E5E7EB;
        }
        .dark .pagination {
            border-top: 1px solid #374151;
        }
        .pagination button {
            padding: 0.5rem 1rem;
            border-radius: 0.75rem;
            transition: all 0.3s ease;
            font-weight: 500;
        }
        .pagination button:hover:not(:disabled) {
            background: #F3F4F6;
        }
        .dark .pagination button:hover:not(:disabled) {
            background: #374151;
        }
        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .pagination .active-page {
            background: #2563EB;
            color: white;
        }
        .dark .pagination .active-page {
            background: #3B82F6;
        }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900">
    <!-- Sidebar -->
    <aside class="fixed left-0 top-0 h-full w-64 bg-white dark:bg-gray-800 shadow-xl z-50 transition-transform -translate-x-full md:translate-x-0" id="sidebar">
        <div class="p-6">
            <div class="flex items-center space-x-3 mb-8">
                <div class="w-10 h-10 gradient-bg rounded-xl flex items-center justify-center">
                    <i class="fas fa-graduation-cap text-white text-xl"></i>
                </div>
                <span class="text-xl font-bold text-gray-900 dark:text-white">CastroEduConnect</span>
            </div>
            
            <nav class="space-y-1">
                <a href="dashboard.html" class="sidebar-link">
                    <i class="fas fa-th-large w-5"></i> Dashboard
                </a>
                <a href="subjects.html" class="sidebar-link">
                    <i class="fas fa-book w-5"></i> Subjects
                </a>
                <a href="assignments.html" class="sidebar-link">
                    <i class="fas fa-tasks w-5"></i> Assignments
                </a>
                <a href="assessments.html" class="sidebar-link active">
                    <i class="fas fa-question-circle w-5"></i> Assessments
                </a>
                <a href="results.html" class="sidebar-link">
                    <i class="fas fa-chart-bar w-5"></i> Results
                </a>
                <a href="resources.html" class="sidebar-link">
                    <i class="fas fa-folder w-5"></i> Resources
                </a>
                <a href="announcements.html" class="sidebar-link">
                    <i class="fas fa-bullhorn w-5"></i> Announcements
                </a>
                <a href="profile.html" class="sidebar-link">
                    <i class="fas fa-user w-5"></i> Profile
                </a>
                <a href="settings.html" class="sidebar-link">
                    <i class="fas fa-cog w-5"></i> Settings
                </a>
                <button onclick="logoutUser()" class="sidebar-link w-full text-left text-red-500 hover:text-red-600 hover:bg-red-50 dark:hover:bg-red-900/20">
                    <i class="fas fa-sign-out-alt w-5"></i> Logout
                </button>
            </nav>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="md:ml-64 min-h-screen">
        <!-- Top Bar -->
        <header class="bg-white dark:bg-gray-800 shadow-sm sticky top-0 z-40 border-b border-gray-200 dark:border-gray-700">
            <div class="flex items-center justify-between px-6 py-4">
                <div class="flex items-center space-x-4">
                    <button onclick="toggleSidebar()" class="md:hidden text-gray-600 dark:text-gray-300 text-2xl">
                        <i class="fas fa-bars"></i>
                    </button>
                    <h1 class="text-xl font-bold text-gray-900 dark:text-white">Assessments</h1>
                </div>
                
                <div class="flex-1 max-w-xl mx-4">
                    <div class="relative">
                        <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                        <input type="text" id="search-input" placeholder="Search assessments..." 
                               class="w-full pl-10 pr-4 py-2 border border-gray-200 dark:border-gray-700 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-white" />
                    </div>
                </div>
                
                <div class="flex items-center space-x-4">
                    <button id="dark-mode-toggle" class="text-gray-600 dark:text-gray-300 hover:text-blue-600 text-xl">
                        <i id="dark-mode-icon" class="fas fa-moon"></i>
                    </button>
                    <button onclick="showToast('You have 3 new notifications', 'info')" 
                            class="relative text-gray-600 dark:text-gray-300 hover:text-blue-600">
                        <i class="fas fa-bell text-xl"></i>
                        <span class="absolute -top-1 -right-1 w-5 h-5 bg-red-500 rounded-full text-white text-xs flex items-center justify-center">3</span>
                    </button>
                    <div class="flex items-center space-x-3 cursor-pointer" onclick="window.location.href='profile.html'">
                        <div id="user-avatar" class="w-10 h-10 gradient-bg rounded-full flex items-center justify-center text-white font-semibold">
                            <i class="fas fa-user"></i>
                        </div>
                        <div class="hidden sm:block">
                            <div id="user-name" class="text-sm font-semibold text-gray-900 dark:text-white">Loading...</div>
                            <div id="user-role" class="text-xs text-gray-500 dark:text-gray-400">Loading...</div>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <!-- Content -->
        <div class="p-6">
            <!-- Stats Row -->
            <div class="grid grid-cols-2 md:grid-cols-5 gap-4 mb-6" id="stats-container">
                <div class="bg-white dark:bg-gray-800 rounded-2xl p-4 shadow-sm text-center">
                    <div class="text-2xl font-bold text-blue-600 dark:text-blue-400" id="stat-total">0</div>
                    <div class="text-sm text-gray-500 dark:text-gray-400">Total</div>
                </div>
                <div class="bg-white dark:bg-gray-800 rounded-2xl p-4 shadow-sm text-center">
                    <div class="text-2xl font-bold text-gray-600 dark:text-gray-400" id="stat-draft">0</div>
                    <div class="text-sm text-gray-500 dark:text-gray-400">Draft</div>
                </div>
                <div class="bg-white dark:bg-gray-800 rounded-2xl p-4 shadow-sm text-center">
                    <div class="text-2xl font-bold text-blue-600 dark:text-blue-400" id="stat-published">0</div>
                    <div class="text-sm text-gray-500 dark:text-gray-400">Published</div>
                </div>
                <div class="bg-white dark:bg-gray-800 rounded-2xl p-4 shadow-sm text-center">
                    <div class="text-2xl font-bold text-green-600 dark:text-green-400" id="stat-active">0</div>
                    <div class="text-sm text-gray-500 dark:text-gray-400">Active</div>
                </div>
                <div class="bg-white dark:bg-gray-800 rounded-2xl p-4 shadow-sm text-center">
                    <div class="text-2xl font-bold text-red-600 dark:text-red-400" id="stat-closed">0</div>
                    <div class="text-sm text-gray-500 dark:text-gray-400">Closed</div>
                </div>
            </div>

            <!-- Actions -->
            <div class="flex flex-wrap items-center justify-between gap-4 mb-6">
                <div class="flex flex-wrap items-center gap-3">
                    <select id="filter-subject" class="px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-xl bg-white dark:bg-gray-700 text-gray-900 dark:text-white">
                        <option value="">All Subjects</option>
                    </select>
                    <select id="filter-status" class="px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-xl bg-white dark:bg-gray-700 text-gray-900 dark:text-white">
                        <option value="">All Status</option>
                        <option value="draft">Draft</option>
                        <option value="published">Published</option>
                        <option value="active">Active</option>
                        <option value="closed">Closed</option>
                        <option value="archived">Archived</option>
                    </select>
                    <select id="filter-type" class="px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-xl bg-white dark:bg-gray-700 text-gray-900 dark:text-white">
                        <option value="">All Types</option>
                        <option value="assignment">Assignment</option>
                        <option value="quiz">Quiz</option>
                        <option value="cat">CAT</option>
                        <option value="exam">Exam</option>
                    </select>
                </div>
                <button id="create-assessment-btn" onclick="openCreateAssessmentModal()" 
                        class="btn-primary px-6 py-2 rounded-xl text-white font-semibold flex items-center space-x-2 hidden">
                    <i class="fas fa-plus"></i> <span>Create Assessment</span>
                </button>
            </div>

            <!-- Table -->
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Title</th>
                            <th>Subject</th>
                            <th>Type</th>
                            <th>Status</th>
                            <th>Marks</th>
                            <th>Due Date</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="assessments-table-body">
                        <!-- Loading Skeletons -->
                        <tr class="skeleton-row">
                            <td><div class="skeleton w-8 h-5"></div></td>
                            <td><div class="skeleton w-32 h-5"></div></td>
                            <td><div class="skeleton w-24 h-5"></div></td>
                            <td><div class="skeleton w-20 h-5"></div></td>
                            <td><div class="skeleton w-16 h-5"></div></td>
                            <td><div class="skeleton w-12 h-5"></div></td>
                            <td><div class="skeleton w-24 h-5"></div></td>
                            <td><div class="flex gap-2"><div class="skeleton w-8 h-8"></div><div class="skeleton w-8 h-8"></div></div></td>
                        </tr>
                        <tr class="skeleton-row">
                            <td><div class="skeleton w-8 h-5"></div></td>
                            <td><div class="skeleton w-32 h-5"></div></td>
                            <td><div class="skeleton w-24 h-5"></div></td>
                            <td><div class="skeleton w-20 h-5"></div></td>
                            <td><div class="skeleton w-16 h-5"></div></td>
                            <td><div class="skeleton w-12 h-5"></div></td>
                            <td><div class="skeleton w-24 h-5"></div></td>
                            <td><div class="flex gap-2"><div class="skeleton w-8 h-8"></div><div class="skeleton w-8 h-8"></div></div></td>
                        </tr>
                        <tr class="skeleton-row">
                            <td><div class="skeleton w-8 h-5"></div></td>
                            <td><div class="skeleton w-32 h-5"></div></td>
                            <td><div class="skeleton w-24 h-5"></div></td>
                            <td><div class="skeleton w-20 h-5"></div></td>
                            <td><div class="skeleton w-16 h-5"></div></td>
                            <td><div class="skeleton w-12 h-5"></div></td>
                            <td><div class="skeleton w-24 h-5"></div></td>
                            <td><div class="flex gap-2"><div class="skeleton w-8 h-8"></div><div class="skeleton w-8 h-8"></div></div></td>
                        </tr>
                    </tbody>
                </table>
                
                <!-- Pagination -->
                <div class="pagination" id="pagination-container">
                    <span class="text-sm text-gray-600 dark:text-gray-400" id="pagination-info">Showing 0 of 0</span>
                    <div class="flex items-center gap-2">
                        <button onclick="previousPage()" id="prev-page" disabled>
                            <i class="fas fa-chevron-left"></i> Previous
                        </button>
                        <div id="page-numbers" class="flex gap-1"></div>
                        <button onclick="nextPage()" id="next-page">
                            Next <i class="fas fa-chevron-right"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Create/Edit Assessment Modal -->
    <div id="assessment-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="flex items-center justify-between mb-6">
                <h2 id="modal-title" class="text-2xl font-bold text-gray-900 dark:text-white">Create Assessment</h2>
                <button onclick="closeModal()" class="text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200 text-2xl">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            
            <form id="assessment-form">
                <input type="hidden" id="edit-assessment-id" />
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Title *</label>
                        <input type="text" id="assessment-title" required 
                               class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-white dark:bg-gray-700 text-gray-900 dark:text-white" />
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Description</label>
                        <textarea id="assessment-description" rows="3" 
                                  class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-white dark:bg-gray-700 text-gray-900 dark:text-white"></textarea>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Subject *</label>
                            <select id="assessment-subject" required 
                                    class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-white dark:bg-gray-700 text-gray-900 dark:text-white">
                                <option value="">Select Subject</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Type *</label>
                            <select id="assessment-type" required 
                                    class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-white dark:bg-gray-700 text-gray-900 dark:text-white">
                                <option value="assignment">Assignment</option>
                                <option value="quiz">Quiz</option>
                                <option value="cat">CAT</option>
                                <option value="exam">Exam</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Status</label>
                            <select id="assessment-status" 
                                    class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-white dark:bg-gray-700 text-gray-900 dark:text-white">
                                <option value="draft">Draft</option>
                                <option value="published">Published</option>
                                <option value="active">Active</option>
                                <option value="closed">Closed</option>
                                <option value="archived">Archived</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Grade</label>
                            <select id="assessment-grade" 
                                    class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-white dark:bg-gray-700 text-gray-900 dark:text-white">
                                <option value="">Select Grade</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Opening Date</label>
                            <input type="datetime-local" id="assessment-opening" 
                                   class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-white dark:bg-gray-700 text-gray-900 dark:text-white" />
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Closing Date</label>
                            <input type="datetime-local" id="assessment-closing" 
                                   class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-white dark:bg-gray-700 text-gray-900 dark:text-white" />
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-3 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Total Marks</label>
                            <input type="number" id="assessment-marks" value="100" 
                                   class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-white dark:bg-gray-700 text-gray-900 dark:text-white" />
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Passing Mark</label>
                            <input type="number" id="assessment-passing" value="50"

                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Time Limit (min)</label>
                            <input type="number" id="assessment-time-limit" value="60" 
                                   class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-white dark:bg-gray-700 text-gray-900 dark:text-white" />
                        </div>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Instructions</label>
                        <textarea id="assessment-instructions" rows="2" 
                                  class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-white dark:bg-gray-700 text-gray-900 dark:text-white"></textarea>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <label class="flex items-center space-x-2">
                            <input type="checkbox" id="assessment-randomize" />
                            <span class="text-sm text-gray-700 dark:text-gray-300">Randomize Questions</span>
                        </label>
                        <label class="flex items-center space-x-2">
                            <input type="checkbox" id="assessment-shuffle" />
                            <span class="text-sm text-gray-700 dark:text-gray-300">Shuffle Answers</span>
                        </label>
                        <label class="flex items-center space-x-2">
                            <input type="checkbox" id="assessment-show-answers" />
                            <span class="text-sm text-gray-700 dark:text-gray-300">Show Answers After Submission</span>
                        </label>
                        <label class="flex items-center space-x-2">
                            <input type="checkbox" id="assessment-calculator" />
                            <span class="text-sm text-gray-700 dark:text-gray-300">Allow Calculator</span>
                        </label>
                    </div>
                    
                    <button type="submit" id="save-assessment-btn" 
                            class="w-full btn-primary py-3 rounded-xl text-white font-semibold text-lg">

                    </button>
                </div>
            </form>
        </div>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <script>
        // ============================================
        // SUPABASE CONFIGURATION
        // ============================================
        const SUPABASE_URL = 'https://kfeqmjveemfacrmqrhzk.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_p5OiC1XnOlBLKs2nUYAL1w_LBBh5kDo';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        console.log('✅ Supabase client initialized');

        // ============================================
        // STATE
        // ============================================
        let currentUser = null;
        let userProfile = null;
        let userRole = 'learner';
        let assessments = [];
        let subjects = [];
        let grades = [];
        let filteredAssessments = [];
        
        // Pagination
        let currentPage = 1;
        const itemsPerPage = 10;

        // ============================================
        // TOAST NOTIFICATIONS
        // ============================================
        function showToast(message, type = 'info', duration = 3000) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.innerHTML = `
                <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-2">
                        ${type === 'success' ? '<i class="fas fa-check-circle"></i>' : ''}
                        ${type === 'error' ? '<i class="fas fa-exclamation-circle"></i>' : ''}
                        ${type === 'warning' ? '<i class="fas fa-exclamation-triangle"></i>' : ''}
                        ${type === 'info' ? '<i class="fas fa-info-circle"></i>' : ''}
                        <span>${message}</span>
                    </div>
                    <button onclick="this.parentElement.parentElement.remove()" class="text-white/80 hover:text-white">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            `;
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(100%)';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, duration);
        }

        // ============================================
        // SIDEBAR TOGGLE
        // ============================================
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('-translate-x-full');
        }

        // ============================================
        // LOGOUT
        // ============================================
        async function logoutUser() {
            try {
                const { error } = await supabaseClient.auth.signOut();
                if (error) throw error;
                
                showToast('Logged out successfully!', 'success');
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1000);
            } catch (error) {
                console.error('Logout error:', error);
                showToast('Error logging out: ' + error.message, 'error');
            }
        }

        // ============================================
        // CHECK AUTHENTICATION
        // ============================================
        async function checkAuth() {
            try {
                const { data: { session }, error } = await supabaseClient.auth.getSession();
                
                if (error) throw error;
                
                if (!session) {
                    console.log('No session found, redirecting to login');
                    window.location.href = 'login.html';
                    return false;
                }
                
                currentUser = session.user;
                console.log('✅ User authenticated:', currentUser.email);
                
                await fetchUserProfile();
                updateUserUI();
                await loadData();
                
                return true;
            } catch (error) {
                console.error('Auth check error:', error);
                window.location.href = 'login.html';
                return false;
            }
        }

        // ============================================
        // FETCH USER PROFILE
        // ============================================
        async function fetchUserProfile() {
            try {
                const { data, error } = await supabaseClient
                    .from('profiles')
                    .select('*')
                    .eq('id', currentUser.id)
                    .single();
                
                if (error) throw error;
                
                userProfile = data;
                userRole = data.role || 'learner';
                console.log('👤 User profile loaded:', userProfile);
                
                return userProfile;
            } catch (error) {
                console.error('Error fetching profile:', error);
                userProfile = {
                    first_name: currentUser.user_metadata?.first_name || 'User',
                    last_name: currentUser.user_metadata?.last_name || '',
                    role: currentUser.user_metadata?.role || 'learner'
                };
                userRole = userProfile.role;
                return userProfile;
            }
        }

        // ============================================
        // UPDATE UI WITH USER INFO
        // ============================================
        function updateUserUI() {
            const firstName = userProfile?.first_name || currentUser?.user_metadata?.first_name || 'User';
            const lastName = userProfile?.last_name || currentUser?.user_metadata?.last_name || '';
            const fullName = `${firstName} ${lastName}`.trim();
            
            document.getElementById('user-name').textContent = fullName || currentUser.email;
            const roleDisplay = userRole.charAt(0).toUpperCase() + userRole.slice(1);
            document.getElementById('user-role').textContent = roleDisplay;
            
            const initials = firstName.charAt(0) + (lastName ? lastName.charAt(0) : '');
            document.getElementById('user-avatar').innerHTML = initials || '<i class="fas fa-user"></i>';
            
            // Show/hide create button based on role
            if (userRole === 'teacher' || userRole === 'admin') {
                document.getElementById('create-assessment-btn').classList.remove('hidden');
            }
        }

        // ============================================
        // LOAD DATA
        // ============================================
        async function loadData() {
            try {
                await loadGrades();
                await loadSubjects();
                await loadAssessments();
                populateFilters();
                applyFilters();
                updateStats();
            } catch (error) {
                console.error('Error loading data:', error);
                showToast('Error loading assessments data', 'error');
            }
        }

        // ============================================
        // LOAD GRADES
        // ============================================
        async function loadGrades() {
            try {
                const { data, error } = await supabaseClient
                    .from('grades')
                    .select('*')
                    .order('sort_order', { ascending: true });
                
                if (error) throw error;
                grades = data || [];
                console.log('📚 Grades loaded:', grades.length);
                
                // Populate grade dropdown
                const gradeSelect = document.getElementById('assessment-grade');
                const options = gradeSelect.querySelectorAll('option:not([value=""])');
                options.forEach(opt => opt.remove());
                
                grades.forEach(grade => {
                    const option = document.createElement('option');
                    option.value = grade.id;
                    option.textContent = grade.name;
                    gradeSelect.appendChild(option);
                });
                
                return grades;
            } catch (error) {
                console.error('Error loading grades:', error);
                grades = [];
                return [];
            }
        }

        // ============================================
        // LOAD SUBJECTS
        // ============================================
        async function loadSubjects() {
            try {
                let query = supabaseClient
                    .from('subjects')
                    .select('*');
                
                // If learner, only show enrolled subjects
                if (userRole === 'learner') {
                    const { data: enrolls, error: enrollError } = await supabaseClient
                        .from('subject_enrollments')
                        .select('subject_id')
                        .eq('learner_id', currentUser.id)
                        .eq('status', 'active');
                    
                    if (enrollError) throw enrollError;
                    
                    const subjectIds = enrolls?.map(e => e.subject_id) || [];
                    if (subjectIds.length > 0) {
                        query = query.in('id', subjectIds);
                    } else {
                        subjects = [];
                        return;
                    }
                } else {
                    // Teachers see their subjects
                    query = query.eq('teacher_id', currentUser.id);
                }
                
                const { data, error } = await query;
                
                if (error) throw error;
                subjects = data || [];
                console.log('📚 Subjects loaded:', subjects.length);
                return subjects;
            } catch (error) {
                console.error('Error loading subjects:', error);
                subjects = [];
                return [];
            }
        }

        // ============================================
        // LOAD ASSESSMENTS
        // ============================================
        async function loadAssessments() {
            try {
                let query = supabaseClient
                    .from('assessments')
                    .select(`
                        *,
                        subjects (id, name, code, color),
                        grades (id, name, code),
                        profiles (first_name, last_name)
                    `);
                
                // If learner, only show assessments from enrolled subjects
                if (userRole === 'learner') {
                    const subjectIds = subjects.map(s => s.id);
                    if (subjectIds.length > 0) {
                        query = query.in('subject_id', subjectIds);
                    } else {
                        assessments = [];
                        return;
                    }
                } else {
                    // Teachers see their assessments
                    query = query.eq('teacher_id', currentUser.id);
                }
                
                const { data, error } = await query.order('created_at', { ascending: false });
                
                if (error) throw error;
                assessments = data || [];
                console.log('📝 Assessments loaded:', assessments.length);
                return assessments;
            } catch (error) {
                console.error('Error loading assessments:', error);
                assessments = [];
                return [];
            }
        }

        // ============================================
        // POPULATE FILTERS
        // ============================================
        function populateFilters() {
            // Populate subject filter
            const subjectSelect = document.getElementById('filter-subject');
            const subjectOptions = subjectSelect.querySelectorAll('option:not([value=""])');
            subjectOptions.forEach(opt => opt.remove());
            
            subjects.forEach(subject => {
                const option = document.createElement('option');
                option.value = subject.id;
                option.textContent = subject.name;
                subjectSelect.appendChild(option);
            });
            
            // Populate subject dropdown in modal
            const modalSubjectSelect = document.getElementById('assessment-subject');
            const modalOptions = modalSubjectSelect.querySelectorAll('option:not([value=""])');
            modalOptions.forEach(opt => opt.remove());
            
            subjects.forEach(subject => {
                const option = document.createElement('option');
                option.value = subject.id;
                option.textContent = subject.name;
                modalSubjectSelect.appendChild(option);
            });
        }

        // ============================================
        // FILTER ASSESSMENTS
        // ============================================
        document.getElementById('filter-subject').addEventListener('change', applyFilters);
        document.getElementById('filter-status').addEventListener('change', applyFilters);
        document.getElementById('filter-type').addEventListener('change', applyFilters);
        document.getElementById('search-input').addEventListener('input', applyFilters);

        function applyFilters() {
            const subjectFilter = document.getElementById('filter-subject').value;
            const statusFilter = document.getElementById('filter-status').value;
            const typeFilter = document.getElementById('filter-type').value;
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            
            filteredAssessments = [...assessments];
            
            if (subjectFilter) {
                filteredAssessments = filteredAssessments.filter(a => a.subject_id === subjectFilter);
            }
            
            if (statusFilter) {
                filteredAssessments = filteredAssessments.filter(a => a.status === statusFilter);
            }
            
            if (typeFilter) {
                filteredAssessments = filteredAssessments.filter(a => a.assessment_type === typeFilter);
            }
            
            if (searchTerm) {
                filteredAssessments = filteredAssessments.filter(a => 
                    a.title.toLowerCase().includes(searchTerm) ||
                    (a.description && a.description.toLowerCase().includes(searchTerm)) ||
                    (a.subjects?.name && a.subjects.name.toLowerCase().includes(searchTerm))
                );
            }
            
            currentPage = 1;
            renderTable();
            updatePagination();
        }

        // ============================================
        // RENDER TABLE
        // ============================================
        function renderTable() {
            const tbody = document.getElementById('assessments-table-body');
            
            if (!filteredAssessments || filteredAssessments.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="8" class="text-center py-8 text-gray-500 dark:text-gray-400">
                            <i class="fas fa-inbox text-4xl block mb-2"></i>
                            No assessments found
                        </td>
                    </tr>
                `;
                return;
            }
            
            // Pagination
            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = Math.min(startIndex + itemsPerPage, filteredAssessments.length);
            const pageItems = filteredAssessments.slice(startIndex, endIndex);
            
            tbody.innerHTML = pageItems.map((assessment, index) => {
                const subject = assessment.subjects;
                const grade = assessment.grades;
                const teacher = assessment.profiles;
                const rowNum = startIndex + index + 1;
                
                const statusClass = assessment.status || 'draft';
                const typeClass = assessment.assessment_type || 'assignment';
                
                const dueDate = assessment.closing_date ? new Date(assessment.closing_date).toLocaleDateString() : 'N/A';
                const isOverdue = assessment.closing_date && new Date(assessment.closing_date) < new Date();
                
                return `
                    <tr>
                        <td class="font-medium text-gray-900 dark:text-white">${rowNum}</td>
                        <td>
                            <div>
                                <div class="font-medium text-gray-900 dark:text-white">${assessment.title}</div>
                                ${assessment.description ? `<div class="text-xs text-gray-500 dark:text-gray-400 truncate max-w-xs">${assessment.description}</div>` : ''}
                            </div>
                        </td>
                        <td>
                            <span class="text-sm" style="color: ${subject?.color || '#2563EB'}">
                                <i class="fas fa-book mr-1"></i> ${subject?.name || 'N/A'}
                            </span>
                        </td>
                        <td>
                            <span class="type-badge type-${typeClass}">${typeClass.toUpperCase()}</span>
                        </td>
                        <td>
                            <span class="status-badge status-${statusClass}">${statusClass.charAt(0).toUpperCase() + statusClass.slice(1)}</span>
                            ${isOverdue && statusClass !== 'closed' ? '<br><span class="text-xs text-red-500">⚠️ Overdue</span>' : ''}
                        </td>
                        <td class="text-center">
                            <div>
                                <span class="font-medium text-gray-900 dark:text-white">${assessment.total_marks || 0}</span>
                                <div class="text-xs text-gray-500 dark:text-gray-400">Pass: ${assessment.passing_mark || 0}</div>
                            </div>
                        </td>
                        <td>
                            <div class="text-sm">
                                <div>${dueDate}</div>
                                ${assessment.time_limit ? `<div class="text-xs text-gray-500 dark:text-gray-400">⏱ ${assessment.time_limit} min</div>` : ''}
                            </div>
                        </td>
                        <td>
                            <div class="flex items-center gap-1">
                                <button onclick="viewAssessment('${assessment.id}')" 
                                        class="p-2 text-blue-600 dark:text-blue-400 hover:bg-blue-50 dark:hover:bg-blue-900/20 rounded-lg transition" title="View">
                                    <i class="fas fa-eye"></i>
                                </button>
                                ${userRole !== 'learner' ? `
                                    <button onclick="editAssessment('${assessment.id}')" 
                                            class="p-2 text-yellow-600 dark:text-yellow-400 hover:bg-yellow-50 dark:hover:bg-yellow-900/20 rounded-lg transition" title="Edit">
                                        <i class="fas fa-edit"></i>
                                    </button>
                                    <button onclick="deleteAssessment('${assessment.id}')" 
                                            class="p-2 text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-900/20 rounded-lg transition" title="Delete">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                ` : ''}
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // ============================================
        // PAGINATION
        // ============================================
        function updatePagination() {
            const totalItems = filteredAssessments.length;
            const totalPages = Math.ceil(totalItems / itemsPerPage);
            
            document.getElementById('pagination-info').textContent = 
                `Showing ${Math.min((currentPage - 1) * itemsPerPage + 1, totalItems)} - ${Math.min(currentPage * itemsPerPage, totalItems)} of ${totalItems}`;
            
            document.getElementById('prev-page').disabled = currentPage <= 1;
            document.getElementById('next-page').disabled = currentPage >= totalPages;
            
            const pageNumbers = document.getElementById('page-numbers');
            pageNumbers.innerHTML = '';
            
            const maxVisible = 5;
            let startPage = Math.max(1, currentPage - Math.floor(maxVisible / 2));
            let endPage = Math.min(totalPages, startPage + maxVisible - 1);
            
            if (endPage - startPage < maxVisible - 1) {
                startPage = Math.max(1, endPage - maxVisible + 1);
            }
            
            if (startPage > 1) {
                const btn = createPageButton(1);
                pageNumbers.appendChild(btn);
                if (startPage > 2) {
                    const dots = document.createElement('span');
                    dots.textContent = '...';
                    dots.className = 'px-2 text-gray-500';
                    pageNumbers.appendChild(dots);
                }
            }
            
            for (let i = startPage; i <= endPage; i++) {
                const btn = createPageButton(i);
                if (i === currentPage) {
                    btn.className += ' active-page';
                }
                pageNumbers.appendChild(btn);
            }
            
            if (endPage < totalPages) {
                if (endPage < totalPages - 1) {
                    const dots = document.createElement('span');
                    dots.textContent = '...';
                    dots.className = 'px-2 text-gray-500';
                    pageNumbers.appendChild(dots);
                }
                const btn = createPageButton(totalPages);
                pageNumbers.appendChild(btn);
            }
        }
        
        function createPageButton(page) {
            const btn = document.createElement('button');
            btn.textContent = page;
            btn.className = 'px-3 py-1 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition';
            btn.onclick = () => goToPage(page);
            return btn;
        }
        
        function goToPage(page) {
            const totalPages = Math.ceil(filteredAssessments.length / itemsPerPage);
            if (page < 1 || page > totalPages) return;
            currentPage = page;
            renderTable();
            updatePagination();
            document.getElementById('assessments-table-body').scrollIntoView({ behavior: 'smooth' });
        }
        
        function previousPage() {
            if (currentPage > 1) {
                goToPage(currentPage - 1);
            }
        }
        
        function nextPage() {
            const totalPages = Math.ceil(filteredAssessments.length / itemsPerPage);
            if (currentPage < totalPages) {
                goToPage(currentPage + 1);
            }
        }

        // ============================================
        // UPDATE STATS
        // ============================================
        function updateStats() {
            document.getElementById('stat-total').textContent = assessments.length;
            document.getElementById('stat-draft').textContent = assessments.filter(a => a.status === 'draft').length;
            document.getElementById('stat-published').textContent = assessments.filter(a => a.status === 'published').length;
            document.getElementById('stat-active').textContent = assessments.filter(a => a.status === 'active').length;
            document.getElementById('stat-closed').textContent = assessments.filter(a => a.status === 'closed').length;
        }

        // ============================================
        // VIEW ASSESSMENT
        // ============================================
        function viewAssessment(assessmentId) {
            const assessment = assessments.find(a => a.id === assessmentId);
            if (!assessment) {
                showToast('Assessment not found', 'error');
                return;
            }
            
            const subject = assessment.subjects;
            const grade = assessment.grades;
            const teacher = assessment.profiles;
            
            const details = `
                <div class="space-y-4">
                    <div class="flex flex-wrap gap-2">
                        <span class="type-badge type-${assessment.assessment_type || 'assignment'}">${(assessment.assessment_type || 'assignment').toUpperCase()}</span>
                        <span class="status-badge status-${assessment.status || 'draft'}">${(assessment.status || 'draft').charAt(0).toUpperCase() + (assessment.status || 'draft').slice(1)}</span>
                        ${subject ? `<span class="text-sm px-2 py-1 rounded-full" style="background: ${subject.color || '#2563EB'}20; color: ${subject.color || '#2563EB'}">${subject.name}</span>` : ''}
                        ${grade ? `<span class="text-sm px-2 py-1 rounded-full bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-400">${grade.name}</span>` : ''}
                    </div>
                    
                    <h3 class="text-xl font-bold text-gray-900 dark:text-white">${assessment.title}</h3>
                    ${assessment.description ? `<p class="text-gray-600 dark:text-gray-400">${assessment.description}</p>` : ''}
                    
                    <div class="grid grid-cols-2 md:grid-cols-3 gap-4 p-4 bg-gray-50 dark:bg-gray-900/50 rounded-xl">
                        <div>
                            <p class="text-sm text-gray-500 dark:text-gray-400">Teacher</p>
                            <p class="font-medium text-gray-900 dark:text-white">${teacher?.first_name || 'Unknown'} ${teacher?.last_name || ''}</p>
                        </div>
                        <div>
                            <p class="text-sm text-gray-500 dark:text-gray-400">Total Marks</p>
                            <p class="font-medium text-gray-900 dark:text-white">${assessment.total_marks || 0}</p>
                        </div>
                        <div>
                            <p class="text-sm text-gray-500 dark:text-gray-400">Passing Mark</p>
                            <p class="font-medium text-gray-900 dark:text-white">${assessment.passing_mark || 0}</p>
                        </div>
                        <div>
                            <p class="text-sm text-gray-500 dark:text-gray-400">Time Limit</p>
                            <p class="font-medium text-gray-900 dark:text-white">${assessment.time_limit || 0} minutes</p>
                        </div>
                        <div>
                            <p class="text-sm text-gray-500 dark:text-gray-400">Opening Date</p>
                            <p class="font-medium text-gray-900 dark:text-white">${assessment.opening_date ? new Date(assessment.opening_date).toLocaleString() : 'Not set'}</p>
                        </div>
                        <div>
                            <p class="text-sm text-gray-500 dark:text-gray-400">Closing Date</p>
                            <p class="font-medium text-gray-900 dark:text-white">${assessment.closing_date ? new Date(assessment.closing_date).toLocaleString() : 'Not set'}</p>
                        </div>
                    </div>
                    
                    ${assessment.instructions ? `
                        <div class="p-4 bg-blue-50 dark:bg-blue-900/20 rounded-xl">
                            <h4 class="font-semibold text-gray-900 dark:text-white mb-2">Instructions</h4>
                            <p class="text-sm text-gray-600 dark:text-gray-400">${assessment.instructions}</p>
                        </div>
                    ` : ''}
                    
                    <div class="flex flex-wrap gap-4 text-sm">
                        ${assessment.randomize_questions ? '<span class="text-gray-600 dark:text-gray-400">✅ Randomize Questions</span>' : ''}
                        ${assessment.shuffle_answers ? '<span class="text-gray-600 dark:text-gray-400">✅ Shuffle Answers</span>' : ''}
                        ${assessment.show_answers_after_submission ? '<span class="text-gray-600 dark:text-gray-400">✅ Show Answers After Submission</span>' : ''}
                        ${assessment.allow_calculator ? '<span class="text-gray-600 dark:text-gray-400">✅ Allow Calculator</span>' : ''}
                    </div>
                </div>
            `;
            
            // Show in a modal or alert
            showToast(`Viewing: ${assessment.title}`, 'info');
            
            // For better viewing, create a temporary modal
            const viewModal = document.createElement('div');
            viewModal.className = 'modal-overlay active';
            viewModal.innerHTML = `
                <div class="modal-content max-w-2xl">
                    <div class="flex items-center justify-between mb-6">
                        <h2 class="text-2xl font-bold text-gray-900 dark:text-white">Assessment Details</h2>
                        <button onclick="this.closest('.modal-overlay').remove()" class="text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200 text-2xl">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                    ${details}
                </div>
            `;
            document.body.appendChild(viewModal);
            
            // Close on overlay click
            viewModal.addEventListener('click', function(e) {
                if (e.target === this) {
                    this.remove();
                }
            });
        }

        // ============================================
        // OPEN CREATE ASSESSMENT MODAL
        // ============================================
        function openCreateAssessmentModal() {
            if (userRole === 'learner') {
                showToast('Only teachers and admins can create assessments', 'warning');
                return;
            }
            
            document.getElementById('modal-title').textContent = 'Create Assessment';
            document.getElementById('edit-assessment-id').value = '';
            document.getElementById('assessment-title').value = '';
            document.getElementById('assessment-description').value = '';
            document.getElementById('assessment-subject').value = '';
            document.getElementById('assessment-type').value = 'assignment';
            document.getElementById('assessment-status').value = 'draft';
            document.getElementById('assessment-grade').value = '';
            document.getElementById('assessment-opening').value = '';
            document.getElementById('assessment-closing').value = '';
            document.getElementById('assessment-marks').value = '100';
            document.getElementById('assessment-passing').value = '50';
            document.getElementById('assessment-time-limit').value = '60';
            document.getElementById('assessment-instructions').value = '';
            document.getElementById('assessment-randomize').checked = false;
            document.getElementById('assessment-shuffle').checked = false;
            document.getElementById('assessment-show-answers').checked = false;
            document.getElementById('assessment-calculator').checked = false;
            document.getElementById('save-assessment-btn').innerHTML = '<i class="fas fa-save mr-2"></i> Save Assessment';
            
            document.getElementById('assessment-modal').classList.add('active');
        }

        // ============================================
        // EDIT ASSESSMENT
        // ============================================
        function editAssessment(assessmentId) {
            if (userRole === 'learner') {
                showToast('Only teachers and admins can edit assessments', 'warning');
                return;
            }
            
            const assessment = assessments.find(a => a.id === assessmentId);
            if (!assessment) {
                showToast('Assessment not found', 'error');
                return;
            }
            
            document.getElementById('modal-title').textContent = 'Edit Assessment';
            document.getElementById('edit-assessment-id').value = assessment.id;
            document.getElementById('assessment-title').value = assessment.title;
            document.getElementById('assessment-description').value = assessment.description || '';
            document.getElementById('assessment-subject').value = assessment.subject_id || '';
            document.getElementById('assessment-type').value = assessment.assessment_type || 'assignment';
            document.getElementById('assessment-status').value = assessment.status || 'draft';
            document.getElementById('assessment-grade').value = assessment.grade_id || '';
            document.getElementById('assessment-opening').value = assessment.opening_date ? assessment.opening_date.slice(0, 16) : '';
            document.getElementById('assessment-closing').value = assessment.closing_date ? assessment.closing_date.slice(0, 16) : '';
            document.getElementById('assessment-marks').value = assessment.total_marks || 100;
            document.getElementById('assessment-passing').value = assessment.passing_mark || 50;
            document.getElementById('assessment-time-limit').value = assessment.time_limit || 60;
            document.getElementById('assessment-instructions').value = assessment.instructions || '';
            document.getElementById('assessment-randomize').checked = assessment.randomize_questions || false;
            document.getElementById('assessment-shuffle').checked = assessment.shuffle_answers || false;
            document.getElementById('assessment-show-answers').checked = assessment.show_answers_after_submission || false;
            document.getElementById('assessment-calculator').checked = assessment.allow_calculator || false;
            document.getElementById('save-assessment-btn').innerHTML = '<i class="fas fa-save mr-2"></i> Update Assessment';
            
            document.getElementById('assessment-modal').classList.add('active');
        }

        // ============================================
        // CLOSE MODAL
        // ============================================
        function closeModal() {
            document.getElementById('assessment-modal').classList.remove('active');
        }

        // ============================================
        // SAVE ASSESSMENT
        // ============================================
        document.getElementById('assessment-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const editId = document.getElementById('edit-assessment-id').value;
            const title = document.getElementById('assessment-title').value.trim();
            const description = document.getElementById('assessment-description').value.trim();
            const subjectId = document.getElementById('assessment-subject').value;
            const type = document.getElementById('assessment-type').value;
            const status = document.getElementById('assessment-status').value;
            const gradeId = document.getElementById('assessment-grade').value;
            const openingDate = document.getElementById('assessment-opening').value;
            const closingDate = document.getElementById('assessment-closing').value;
            const totalMarks = parseInt(document.getElementById('assessment-marks').value) || 100;
            const passingMark = parseInt(document.getElementById('assessment-passing').value) || 50;
            const timeLimit = parseInt(document.getElementById('assessment-time-limit').value) || 60;
            const instructions = document.getElementById('assessment-instructions').value.trim();
            const randomize = document.getElementById('assessment-randomize').checked;
            const shuffle = document.getElementById('assessment-shuffle').checked;
            const showAnswers = document.getElementById('assessment-show-answers').checked;
            const calculator = document.getElementById('assessment-calculator').checked;
            
            if (!title || !subjectId) {
                showToast('Please fill in all required fields', 'warning');
                return;
            }
            
            const btn = document.getElementById('save-assessment-btn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner spinner mr-2"></i> Saving...';
            
            try {
                const assessmentData = {
                    title,
                    description,
                    subject_id: subjectId,
                    teacher_id: currentUser.id,
                    assessment_type: type,
                    status: status,
                    grade_id: gradeId || null,
                    opening_date: openingDate || null,
                    closing_date: closingDate || null,
                    total_marks: totalMarks,
                    passing_mark: passingMark,
                    time_limit: timeLimit,
                    instructions: instructions || null,
                    randomize_questions: randomize,
                    shuffle_answers: shuffle,
                    show_answers_after_submission: showAnswers,
                    allow_calculator: calculator
                };
                
                let result;
                
                if (editId) {
                    // Update existing assessment
                    const { data, error } = await supabaseClient
                        .from('assessments')
                        .update(assessmentData)
                        .eq('id', editId)
                        .select();
                    
                    if (error) throw error;
                    result = data;
                    showToast('Assessment updated successfully! ✅', 'success');
                } else {
                    // Create new assessment
                    const { data, error } = await supabaseClient
                        .from('assessments')
                        .insert([assessmentData])
                        .select();
                    
                    if (error) throw error;
                    result = data;
                    showToast('Assessment created successfully! 🎉', 'success');
                }
                
                closeModal();
                await loadData();
                
            } catch (error) {
                console.error('Error saving assessment:', error);
                showToast('Error saving assessment: ' + error.message, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-save mr-2"></i> Save Assessment';
            }
        });

        // ============================================
        // DELETE ASSESSMENT
        // ============================================
        async function deleteAssessment(assessmentId) {
            if (userRole === 'learner') {
                showToast('Only teachers and admins can delete assessments', 'warning');
                return;
            }
            
            const assessment = assessments.find(a => a.id === assessmentId);
            if (!assessment) {
                showToast('Assessment not found', 'error');
                return;
            }
            
            if (!confirm(`Are you sure you want to delete "${assessment.title}"? This action cannot be undone.`)) {
                return;
            }
            
            try {
                const { error } = await supabaseClient
                    .from('assessments')
                    .delete()
                    .eq('id', assessmentId);
                
                if (error) throw error;
                
                showToast('Assessment deleted successfully', 'success');
                await loadData();
                
            } catch (error) {
                console.error('Error deleting assessment:', error);
                showToast('Error deleting assessment: ' + error.message, 'error');
            }
        }

        // ============================================
        // DARK MODE
        // ============================================
        function toggleDarkMode() {
            const html = document.documentElement;
            const isDark = html.classList.toggle('dark');
            localStorage.setItem('darkMode', isDark ? 'true' : 'false');
            updateDarkModeIcon(isDark);
        }

        function updateDarkModeIcon(isDark) {
            const icon = document.getElementById('dark-mode-icon');
            icon.className = isDark ? 'fas fa-sun' : 'fas fa-moon';
        }

        function initDarkMode() {
            const saved = localStorage.getItem('darkMode');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const isDark = saved ? saved === 'true' : prefersDark;
            if (isDark) {
                document.documentElement.classList.add('dark');
                updateDarkModeIcon(true);
            }
        }

        // ============================================
        // CLOSE MODAL ON OVERLAY CLICK
        // ============================================
        document.getElementById('assessment-modal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        // ============================================
        // KEYBOARD SHORTCUTS
        // ============================================
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
            }
        });

        // ============================================
        // INITIALIZATION
        // ============================================
        (async function init() {
            console.log('🚀 CastroEduConnect Assessments Page Loading...');
            
            // Init dark mode
            initDarkMode();
            
            // Setup dark mode toggle
            document.getElementById('dark-mode-toggle').addEventListener('click', toggleDarkMode);
            
            // Check authentication
            const isAuth = await checkAuth();
            
            if (!isAuth) {
                console.log('❌ Not authenticated, redirecting...');
                window.location.href = 'login.html';
                return;
            }
            
            console.log('✅ Assessments page initialized successfully');
        })();
    </script>
</body>
</html>
