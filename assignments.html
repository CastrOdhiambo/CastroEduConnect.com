<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <link rel="stylesheet" href="style.css" />
    
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        .sidebar-link {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            color: #6b7280;
            transition: all 0.3s ease;
            cursor: pointer;
            text-decoration: none;
        }
        .sidebar-link:hover {
            background: rgba(37, 99, 235, 0.1);
            color: #2563EB;
        }
        .sidebar-link.active {
            background: linear-gradient(135deg, #2563EB, #4F46E5);
            color: white;
        }
        .dark .sidebar-link {
            color: #9ca3af;
        }
        .dark .sidebar-link:hover {
            background: rgba(37, 99, 235, 0.2);
            color: #60a5fa;
        }
        
        .gradient-bg {
            background: linear-gradient(135deg, #2563EB 0%, #4F46E5 50%, #7C3AED 100%);
        }
        
        .assignment-card {
            background: white;
            border-radius: 1.5rem;
            padding: 1.5rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
            border-left: 4px solid #2563EB;
        }
        .assignment-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 30px rgba(37, 99, 235, 0.15);
        }
        .dark .assignment-card {
            background: #1a1a2e;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        
        .spinner {
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .toast-container {
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .toast {
            padding: 1rem 1.5rem;
            border-radius: 0.75rem;
            color: white;
            animation: slideInRight 0.5s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            min-width: 300px;
            max-width: 450px;
        }
        .toast-success { background: #10B981; }
        .toast-error { background: #EF4444; }
        .toast-warning { background: #F59E0B; }
        .toast-info { background: #3B82F6; }
        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 9998;
            display: none;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-content {
            background: white;
            border-radius: 2rem;
            padding: 2rem;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            animation: modalPop 0.3s ease;
        }
        .dark .modal-content {
            background: #1a1a2e;
        }
        @keyframes modalPop {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        
        .status-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .status-draft { background: #E5E7EB; color: #6B7280; }
        .status-published { background: #DBEAFE; color: #2563EB; }
        .status-active { background: #D1FAE5; color: #059669; }
        .status-closed { background: #FEE2E2; color: #DC2626; }
        .status-archived { background: #F3F4F6; color: #9CA3AF; }
        .dark .status-draft { background: #374151; color: #9CA3AF; }
        .dark .status-published { background: #1E3A5F; color: #60A5FA; }
        .dark .status-active { background: #065F46; color: #34D399; }
        .dark .status-closed { background: #7F1D1D; color: #F87171; }
        .dark .status-archived { background: #1F2937; color: #6B7280; }
    </style>
</head>

    <script>
        // ============================================
        // SUPABASE CONFIGURATION
        // ============================================
        const SUPABASE_URL = 'https://kfeqmjveemfacrmqrhzk.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_p5OiC1XnOlBLKs2nUYAL1w_LBBh5kDo';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        console.log('✅ Supabase client initialized');

        // ============================================
        // STATE
        // ============================================
        let currentUser = null;
        let userProfile = null;
        let userRole = 'learner';
        let assignments = [];
        let subjects = [];
        let submissions = [];

        // ============================================
        // TOAST NOTIFICATIONS
        // ============================================
        function showToast(message, type = 'info', duration = 3000) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.innerHTML = `
                <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-2">
                        ${type === 'success' ? '<i class="fas fa-check-circle"></i>' : ''}
                        ${type === 'error' ? '<i class="fas fa-exclamation-circle"></i>' : ''}
                        ${type === 'warning' ? '<i class="fas fa-exclamation-triangle"></i>' : ''}
                        ${type === 'info' ? '<i class="fas fa-info-circle"></i>' : ''}
                        <span>${message}</span>
                    </div>
                    <button onclick="this.parentElement.parentElement.remove()" class="text-white/80 hover:text-white">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            `;
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(100%)';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, duration);
        }

        // ============================================
        // SIDEBAR TOGGLE
        // ============================================
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('-translate-x-full');
        }

        // ============================================
        // LOGOUT
        // ============================================
        async function logoutUser() {
            try {
                const { error } = await supabaseClient.auth.signOut();
                if (error) throw error;
                
                showToast('Logged out successfully!', 'success');
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1000);
            } catch (error) {
                console.error('Logout error:', error);
                showToast('Error logging out: ' + error.message, 'error');
            }
        }

        // ============================================
        // CHECK AUTHENTICATION
        // ============================================
        async function checkAuth() {
            try {
                const { data: { session }, error } = await supabaseClient.auth.getSession();
                
                if (error) throw error;
                
                if (!session) {
                    console.log('No session found, redirecting to login');
                    window.location.href = 'login.html';
                    return false;
                }
                
                currentUser = session.user;
                console.log('✅ User authenticated:', currentUser.email);
                
                await fetchUserProfile();
                updateUserUI();
                await loadData();
                
                return true;
            } catch (error) {
                console.error('Auth check error:', error);
                window.location.href = 'login.html';
                return false;
            }
        }

        // ============================================
        // FETCH USER PROFILE
        // ============================================
        async function fetchUserProfile() {
            try {
                const { data, error } = await supabaseClient
                    .from('profiles')
                    .select('*')
                    .eq('id', currentUser.id)
                    .single();
                
                if (error) throw error;
                
                userProfile = data;
                userRole = data.role || 'learner';
                console.log('👤 User profile loaded:', userProfile);
                
                return userProfile;
            } catch (error) {
                console.error('Error fetching profile:', error);
                userProfile = {
                    first_name: currentUser.user_metadata?.first_name || 'User',
                    last_name: currentUser.user_metadata?.last_name || '',
                    role: currentUser.user_metadata?.role || 'learner'
                };
                userRole = userProfile.role;
                return userProfile;
            }
        }

        // ============================================
        // UPDATE UI WITH USER INFO
        // ============================================
        function updateUserUI() {
            const firstName = userProfile?.first_name || currentUser?.user_metadata?.first_name || 'User';
            const lastName = userProfile?.last_name || currentUser?.user_metadata?.last_name || '';
            const fullName = `${firstName} ${lastName}`.trim();
            
            document.getElementById('user-name').textContent = fullName || currentUser.email;
            const roleDisplay = userRole.charAt(0).toUpperCase() + userRole.slice(1);
            document.getElementById('user-role').textContent = roleDisplay;
            
            const initials = firstName.charAt(0) + (lastName ? lastName.charAt(0) : '');
            document.getElementById('user-avatar').innerHTML = initials || '<i class="fas fa-user"></i>';
            
            // Show/hide create button based on role
            if (userRole === 'teacher' || userRole === 'admin') {
                document.getElementById('create-assignment-btn').classList.remove('hidden');
            }
        }

        // ============================================
        // LOAD DATA
        // ============================================
        async function loadData() {
            try {
                await loadSubjects();
                await loadAssignments();
                await loadSubmissions();
                renderAssignments();
                populateFilters();
                updateStats();
            } catch (error) {
                console.error('Error loading data:', error);
                showToast('Error loading assignments data', 'error');
            }
        }

        // ============================================
        // LOAD SUBJECTS
        // ============================================
        async function loadSubjects() {
            try {
                let query = supabaseClient
                    .from('subjects')
                    .select('*');
                
                // If learner, only show enrolled subjects
                if (userRole === 'learner') {
                    const { data: enrolls, error: enrollError } = await supabaseClient
                        .from('subject_enrollments')
                        .select('subject_id')
                        .eq('learner_id', currentUser.id)
                        .eq('status', 'active');
                    
                    if (enrollError) throw enrollError;
                    
                    const subjectIds = enrolls?.map(e => e.subject_id) || [];
                    if (subjectIds.length > 0) {
                        query = query.in('id', subjectIds);
                    } else {
                        subjects = [];
                        return;
                    }
                } else {
                    // Teachers see their subjects
                    query = query.eq('teacher_id', currentUser.id);
                }
                
                const { data, error } = await query;
                
                if (error) throw error;
                subjects = data || [];
                console.log('📚 Subjects loaded:', subjects.length);
                return subjects;
            } catch (error) {
                console.error('Error loading subjects:', error);
                subjects = [];
                return [];
            }
        }

        // ============================================
        // LOAD ASSIGNMENTS
        // ============================================
        async function loadAssignments() {
            try {
                let query = supabaseClient
                    .from('assessments')
                    .select(`
                        *,
                        subjects (name, code, color),
                        profiles (first_name, last_name)
                    `);
                
                // If learner, only show published/active assignments from enrolled subjects
                if (userRole === 'learner') {
                    const subjectIds = subjects.map(s => s.id);
                    if (subjectIds.length > 0) {
                        query = query.in('subject_id', subjectIds);
                    } else {
                        assignments = [];
                        return;
                    }
                } else {
                    // Teachers see their assignments
                    query = query.eq('teacher_id', currentUser.id);
                }
                
                const { data, error } = await query.order('created_at', { ascending: false });
                
                if (error) throw error;
                assignments = data || [];
                console.log('📝 Assignments loaded:', assignments.length);
                return assignments;
            } catch (error) {
                console.error('Error loading assignments:', error);
                assignments = [];
                return [];
            }
        }

        // ============================================
        // LOAD SUBMISSIONS
        // ============================================
        async function loadSubmissions() {
            try {
                const { data, error } = await supabaseClient
                    .from('submissions')
                    .select('*')
                    .eq('learner_id', currentUser.id);
                
                if (error) throw error;
                submissions = data || [];
                console.log('📋 Submissions loaded:', submissions.length);
                return submissions;
            } catch (error) {
                console.error('Error loading submissions:', error);
                submissions = [];
                return [];
            }
        }

        // RENDER ASSIGNMENTS
        // ============================================

                        <p class="text-gray-500 dark:text-gray-400 mt-2">
                            ${userRole === 'learner' ? 'No assignments available for your enrolled subjects.' : 'You haven\'t created any assignments yet.'}

                            <button onclick="openCreateAssignmentModal()" class="mt-4 btn-primary px-6 py-2 rounded-xl text-white font-semibold">
                                <i class="fas fa-plus mr-2"></i> Create First Assignment
                            </button>

                    </div>
                `;

            }
            
            container.innerHTML = assignments.map(assignment => {
                const subject = assignment.subjects;
                const teacher = assignment.profiles;
                const submission = submissions.find(s => s.assessment_id === assignment.id);

                    'published': 'status-published',

                    'closed': 'status-closed',

                                    <span class="text-xs font-semibold px-2 py-1 rounded-full" style="background: ${subject?.color || '#2563EB'}20; color: ${subject?.color || '#2563EB'}">
                                        ${subject?.name || 'No Subject'}
                                    </span>
                                    <span class="text-xs font-semibold px-2 py-1 rounded-full bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-400">

                                        '<span class="text-xs font-semibold px-2 py-1 rounded-full bg-red-100 dark:bg-red-900/30 text-red-600 dark:text-red-400">⚠️ Overdue</span>' : ''}
                                </div>
                                
                                <h3 class="text-lg font-bold text-gray-900 dark:text-white">${assignment.title}</h3>
                                <p class="text-sm text-gray-600 dark:text-gray-400 mt-1">${assignment.description || 'No description'}</p>

                                        <i class="fas fa-eye mr-1"></i> View
                                    </button>
                                    ${userRole !== 'learner' ? `
                                        <button onclick="editAssignment('${assignment.id}')" 
                                                class="px-4 py-2 bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-300 rounded-xl hover:bg-gray-200 dark:hover:bg-gray-600 transition font-medium text-sm">
                                            <i class="fas fa-edit mr-1"></i> Edit
                                        </button>
                                        <button onclick="deleteAssignment('${assignment.id}')" 
                                                class="px-4 py-2 bg-red-50 dark:bg-red-900/20 text-red-600 dark:text-red-400 rounded-xl hover:bg-red-100 dark:hover:bg-red-900/30 transition font-medium text-sm">
                                            <i class="fas fa-trash"></i>
                                        </button>
                                    ` : (submissionStatus === 'not_submitted' && !isOverdue ? `
                                        <button onclick="startAssignment('${assignment.id}')" 
                                                class="px-4 py-2 btn-primary rounded-xl text-white font-semibold text-sm">
                                            <i class="fas fa-play mr-1"></i> Start
                                        </button>
                                    ` : '')}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // ============================================
        // UPDATE STATS
        // ============================================
        function updateStats() {
            document.getElementById('stat-total').textContent = assignments.length;
            
            if (userRole === 'learner') {
                const pending = submissions.filter(s => s.status === 'in_progress' || s.status === 'submitted').length;
                const submitted = submissions.filter(s => s.status === 'submitted').length;
                const graded = submissions.filter(s => s.status === 'graded' || s.status === 'returned').length;
                
                document.getElementById('stat-pending').textContent = pending;
                document.getElementById('stat-submitted').textContent = submitted;
                document.getElementById('stat-graded').textContent = graded;
            } else {
                // For teachers, show stats about their assignments
                const total = assignments.length;
                const active = assignments.filter(a => a.status === 'active').length;
                const closed = assignments.filter(a => a.status === 'closed').length;
                
                document.getElementById('stat-pending').textContent = active;
                document.getElementById('stat-submitted').textContent = closed;
                document.getElementById('stat-graded').textContent = total - active - closed;
            }
        }

        // ============================================
        // POPULATE FILTERS
        // ============================================
        function populateFilters() {
            // Populate subject filter
            const subjectSelect = document.getElementById('filter-subject');
            const subjectOptions = subjectSelect.querySelectorAll('option:not([value=""])');
            subjectOptions.forEach(opt => opt.remove());
            
            subjects.forEach(subject => {
                const option = document.createElement('option');
                option.value = subject.id;
                option.textContent = subject.name;
                subjectSelect.appendChild(option);
            });
            
            // Populate subject dropdown in modal
            const modalSubjectSelect = document.getElementById('assignment-subject');
            const modalOptions = modalSubjectSelect.querySelectorAll('option:not([value=""])');
            modalOptions.forEach(opt => opt.remove());
            
            subjects.forEach(subject => {
                const option = document.createElement('option');
                option.value = subject.id;
                option.textContent = subject.name;
                modalSubjectSelect.appendChild(option);
            });
        }

        // ============================================
        // FILTER ASSIGNMENTS
        // ============================================
        document.getElementById('filter-subject').addEventListener('change', filterAssignments);
        document.getElementById('filter-status').addEventListener('change', filterAssignments);
        document.getElementById('filter-type').addEventListener('change', filterAssignments);
        document.getElementById('search-input').addEventListener('input', filterAssignments);

        function filterAssignments() {
            const subjectFilter = document.getElementById('filter-subject').value;
            const statusFilter = document.getElementById('filter-status').value;
            const typeFilter = document.getElementById('filter-type').value;
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            
            let filtered = [...assignments];
            
            if (subjectFilter) {
                filtered = filtered.filter(a => a.subject_id === subjectFilter);
            }
            
            if (statusFilter) {
                filtered = filtered.filter(a => a.status === statusFilter);
            }
            
            if (typeFilter) {
                filtered = filtered.filter(a => a.assessment_type === typeFilter);
            }
            
            if (searchTerm) {
                filtered = filtered.filter(a => 
                    a.title.toLowerCase().includes(searchTerm) ||
                    (a.description && a.description.toLowerCase().includes(searchTerm))
                );
            }
            
            // Re-render with filtered assignments
            const originalAssignments = assignments;
            assignments = filtered;
            renderAssignments();
            assignments = originalAssignments;
        }

                        </span>
                        <span class="text-xs font-semibold px-2 py-1 rounded-full bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-400">

                        </span>
                        <span class="status-badge ${assignment.status === 'draft' ? 'status-draft' : assignment.status === 'published' ? 'status-published' : assignment.status === 'active' ? 'status-active' : assignment.status === 'closed' ? 'status-closed' : 'status-archived'}">

                    <div class="grid grid-cols-2 gap-4 p-4 bg-gray-50 dark:bg-gray-900/50 rounded-xl">

                        <div>
                            <p class="text-sm text-gray-500 dark:text-gray-400">Total Marks</p>

                        </div>
                        <div>
                            <p class="text-sm text-gray-500 dark:text-gray-400">Passing Mark</p>

                            <p class="text-sm text-gray-500 dark:text-gray-400">Time Limit</p>

                        </div>
                        <div>
                            <p class="text-sm text-gray-500 dark:text-gray-400">Closing Date</p>
                            <p class="font-medium text-gray-900 dark:text-white">${assignment.closing_date ? new Date(assignment.closing_date).toLocaleString() : 'Not set'}</p>

                    </div>
                    
                    ${submission ? `
                        <div class="p-4 bg-blue-50 dark:bg-blue-900/20 rounded-xl">
                            <h4 class="font-semibold text-gray-900 dark:text-white mb-2">Your Submission</h4>
                            <p class="text-sm text-gray-600 dark:text-gray-400">Status: ${submission.status}</p>
                            ${submission.percentage ? `<p class="text-sm text-gray-600 dark:text-gray-400">Score: ${Math.round(submission.percentage)}%</p>` : ''}
                            ${submission.grade ? `<p class="text-sm text-gray-600 dark:text-gray-400">Grade: ${submission.grade}</p>` : ''}
                            ${submission.teacher_comment ? `<p class="text-sm text-gray-600 dark:text-gray-400">Feedback: ${submission.teacher_comment}</p>` : ''}
                        </div>
                    ` : userRole === 'learner' && assignment.status === 'active' && !isOverdue(assignment.closing_date) ? `
                        <button onclick="startAssignment('${assignment.id}')" class="w-full btn-primary py-3 rounded-xl text-white font-semibold text-lg">
                            <i class="fas fa-play mr-2"></i> Start Assignment

        // ============================================
        // CHECK IF OVERDUE
        // ============================================
        function isOverdue(closingDate) {
            return closingDate && new Date(closingDate) < new Date();
        }

        // ============================================
        // GET DAYS UNTIL
        // ============================================
        function getDaysUntil(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diffTime = date - now;
            return Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        }

        // ============================================
        // START ASSIGNMENT
        // ============================================
        async function startAssignment(assignmentId) {
            try {
                // Check if already started
                const existing = submissions.find(s => s.assessment_id === assignmentId);
                if (existing) {
                    showToast('You already have a submission in progress', 'warning');
                    return;
                }
                
                // Create submission
                const { data, error } = await supabaseClient
                    .from('submissions')
                    .insert([{
                        assessment_id: assignmentId,
                        learner_id: currentUser.id,
                        status: 'in_progress',
                        started_at: new Date().toISOString()
                    }])
                    .select();
                
                if (error) throw error;
                
                showToast('Assignment started! Good luck! 🍀', 'success');
                await loadSubmissions();
                renderAssignments();
                
            } catch (error) {
                console.error('Error starting assignment:', error);
                showToast('Error starting assignment: ' + error.message, 'error');
            }
        }

        // ============================================
        // OPEN CREATE ASSIGNMENT MODAL
        // ============================================
        function openCreateAssignmentModal() {
            if (userRole === 'learner') {
                showToast('Only teachers and admins can create assignments', 'warning');
                return;
            }
            
            document.getElementById('modal-title').textContent = 'Create Assignment';
            document.getElementById('edit-assignment-id').value = '';
            document.getElementById('assignment-title').value = '';
            document.getElementById('assignment-description').value = '';
            document.getElementById('assignment-subject').value = '';
            document.getElementById('assignment-type').value = 'assignment';
            document.getElementById('assignment-opening').value = '';
            document.getElementById('assignment-closing').value = '';
            document.getElementById('assignment-marks').value = '100';
            document.getElementById('assignment-passing').value = '50';
            document.getElementById('assignment-time-limit').value = '60';
            document.getElementById('assignment-randomize').checked = false;

            document.getElementById('assignment-modal').classList.add('active');

        // ============================================
        // EDIT ASSIGNMENT
        // ============================================
        function editAssignment(assignmentId) {
            if (userRole === 'learner') {
                showToast('Only teachers and admins can edit assignments', 'warning');
                return;
            }
            
            const assignment = assignments.find(a => a.id === assignmentId);
            if (!assignment) {
                showToast('Assignment not found', 'error');
                return;
            }
            
            document.getElementById('modal-title').textContent = 'Edit Assignment';
            document.getElementById('edit-assignment-id').value = assignment.id;
            document.getElementById('assignment-title').value = assignment.title;
            document.getElementById('assignment-description').value = assignment.description || '';
            document.getElementById('assignment-subject').value = assignment.subject_id || '';
            document.getElementById('assignment-type').value = assignment.assessment_type || 'assignment';
            document.getElementById('assignment-opening').value = assignment.opening_date ? assignment.opening_date.slice(0, 16) : '';
            document.getElementById('assignment-closing').value = assignment.closing_date ? assignment.closing_date.slice(0, 16) : '';
            document.getElementById('assignment-marks').value = assignment.total_marks || 100;
            document.getElementById('assignment-passing').value = assignment.passing_mark || 50;
            document.getElementById('assignment-time-limit').value = assignment.time_limit || 60;
            document.getElementById('assignment-randomize').checked = assignment.randomize_questions || false;
            document.getElementById('assignment-shuffle').checked = assignment.shuffle_answers || false;
            document.getElementById('save-assignment-btn').innerHTML = '<i class="fas fa-save mr-2"></i> Update Assignment';
            
            document.getElementById('assignment-modal').classList.add('active');
        }

        // ============================================
        // CLOSE MODAL
        // ============================================
        function closeModal() {
            document.getElementById('assignment-modal').classList.remove('active');
        }

        function closeViewModal() {
            document.getElementById('view-assignment-modal').classList.remove('active');
        }

        // ============================================
        // SAVE ASSIGNMENT
        // ============================================
        document.getElementById('assignment-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const editId = document.getElementById('edit-assignment-id').value;
            const title = document.getElementById('assignment-title').value.trim();
            const description = document.getElementById('assignment-description').value.trim();
            const subjectId = document.getElementById('assignment-subject').value;
            const type = document.getElementById('assignment-type').value;
            const openingDate = document.getElementById('assignment-opening').value;
            const closingDate = document.getElementById('assignment-closing').value;
            const totalMarks = parseInt(document.getElementById('assignment-marks').value) || 100;
            const passingMark = parseInt(document.getElementById('assignment-passing').value) || 50;
            const timeLimit = parseInt(document.getElementById('assignment-time-limit').value) || 60;
            const randomize = document.getElementById('assignment-randomize').checked;
            const shuffle = document.getElementById('assignment-shuffle').checked;
            
            if (!title || !subjectId) {
                showToast('Please fill in all required fields', 'warning');
                return;
            }
            
            const btn = document.getElementById('save-assignment-btn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner spinner mr-2"></i> Saving...';
            
            try {
                const assignmentData = {
                    title,
                    description,
                    subject_id: subjectId,
                    teacher_id: currentUser.id,
                    assessment_type: type,
                    opening_date: openingDate || null,
                    closing_date: closingDate || null,
                    total_marks: totalMarks,
                    passing_mark: passingMark,
                    time_limit: timeLimit,
                    randomize_questions: randomize,
                    shuffle_answers: shuffle,
                    status: 'draft'
                };
                
                let result;
                
                if (editId) {
                    // Update existing assignment
                    const { data, error } = await supabaseClient
                        .from('assessments')
                        .update(assignmentData)
                        .eq('id', editId)
                        .select();
                    
                    if (error) throw error;
                    result = data;
                    showToast('Assignment updated successfully! ✅', 'success');
                } else {
                    // Create new assignment
                    const { data, error } = await supabaseClient
                        .from('assessments')
                        .insert([assignmentData])
                        .select();
                    
                    if (error) throw error;
                    result = data;
                    showToast('Assignment created successfully! 🎉', 'success');
                }
                
                closeModal();
                await loadData();
                
            } catch (error) {
                console.error('Error saving assignment:', error);
                showToast('Error saving assignment: ' + error.message, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-save mr-2"></i> Save Assignment';
            }
        });

        // ============================================
        // DELETE ASSIGNMENT
        // ============================================
        async function deleteAssignment(assignmentId) {
            if (userRole === 'learner') {
                showToast('Only teachers and admins can delete assignments', 'warning');
                return;
            }
            
            const assignment = assignments.find(a => a.id === assignmentId);
            if (!assignment) {
                showToast('Assignment not found', 'error');
                return;
            }
            
            if (!confirm(`Are you sure you want to delete "${assignment.title}"? This action cannot be undone.`)) {
                return;
            }
            
            try {
                const { error } = await supabaseClient
                    .from('assessments')
                    .delete()
                    .eq('id', assignmentId);
                
                if (error) throw error;
                
                showToast('Assignment deleted successfully', 'success');
                await loadData();
                
            } catch (error) {
                console.error('Error deleting assignment:', error);
                showToast('Error deleting assignment: ' + error.message, 'error');
            }
        }

        // ============================================
        // DARK MODE
        // ============================================
        function toggleDarkMode() {
            const html = document.documentElement;
            const isDark = html.classList.toggle('dark');
            localStorage.setItem('darkMode', isDark ? 'true' : 'false');
            updateDarkModeIcon(isDark);
        }

        function updateDarkModeIcon(isDark) {
            const icon = document.getElementById('dark-mode-icon');
            icon.className = isDark ? 'fas fa-sun' : 'fas fa-moon';
        }

        function initDarkMode() {
            const saved = localStorage.getItem('darkMode');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const isDark = saved ? saved === 'true' : prefersDark;
            if (isDark) {
                document.documentElement.classList.add('dark');
                updateDarkModeIcon(true);
            }
        }

        // ============================================
        // CLOSE MODAL ON OVERLAY CLICK
        // ============================================
        document.getElementById('assignment-modal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });
        
        document.getElementById('view-assignment-modal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeViewModal();
            }
        });

        // ============================================
        // KEYBOARD SHORTCUTS
        // ============================================
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
                closeViewModal();
            }
        });

        // ============================================
        // INITIALIZATION
        // ============================================
        (async function init() {
            console.log('🚀 CastroEduConnect Assignments Page Loading...');
            
            // Init dark mode
            initDarkMode();
            
            // Setup dark mode toggle
            document.getElementById('dark-mode-toggle').addEventListener('click', toggleDarkMode);
            
            // Check authentication
            const isAuth = await checkAuth();
            
            if (!isAuth) {
                console.log('❌ Not authenticated, redirecting...');
                window.location.href = 'login.html';
                return;
            }
            
            console.log('✅ Assignments page initialized successfully');
        })();
    </script>
</body>
</html>
