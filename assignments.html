<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assignments - CastroEduConnect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        .sidebar-link {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            color: #6b7280;
            transition: all 0.3s ease;
            cursor: pointer;
            text-decoration: none;
        }
        .sidebar-link:hover {
            background: rgba(37, 99, 235, 0.1);
            color: #2563EB;
        }
        .sidebar-link.active {
            background: linear-gradient(135deg, #2563EB, #4F46E5);
            color: white;
        }
        .dark .sidebar-link {
            color: #9ca3af;
        }
        .dark .sidebar-link:hover {
            background: rgba(37, 99, 235, 0.2);
            color: #60a5fa;
        }
        
        .gradient-bg {
            background: linear-gradient(135deg, #2563EB 0%, #4F46E5 50%, #7C3AED 100%);
        }
        
        .spinner {
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .toast-container {
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .toast {
            padding: 1rem 1.5rem;
            border-radius: 0.75rem;
            color: white;
            animation: slideInRight 0.5s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            min-width: 300px;
            max-width: 450px;
        }
        .toast-success { background: #10B981; }
        .toast-error { background: #EF4444; }
        .toast-warning { background: #F59E0B; }
        .toast-info { background: #3B82F6; }
        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 9998;
            display: none;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-content {
            background: white;
            border-radius: 2rem;
            padding: 2rem;
            max-width: 800px;
            width: 95%;
            max-height: 90vh;
            overflow-y: auto;
            animation: modalPop 0.3s ease;
        }
        .dark .modal-content {
            background: #1a1a2e;
        }
        @keyframes modalPop {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        
        .assignment-card {
            background: white;
            border-radius: 1.5rem;
            padding: 1.5rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
            border-left: 4px solid #2563EB;
        }
        .assignment-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 30px rgba(37, 99, 235, 0.15);
        }
        .dark .assignment-card {
            background: #1a1a2e;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        
        .question-block {
            background: #F9FAFB;
            border-radius: 1rem;
            padding: 1rem;
            margin-bottom: 1rem;
        }
        .dark .question-block {
            background: #1F2937;
        }
        
        .choice-option {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.5rem 1rem;
            border-radius: 0.75rem;
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .choice-option:hover {
            background: rgba(37, 99, 235, 0.05);
        }
        .dark .choice-option:hover {
            background: rgba(37, 99, 235, 0.1);
        }
        .choice-option.selected {
            background: rgba(37, 99, 235, 0.1);
            border: 2px solid #2563EB;
        }
        .dark .choice-option.selected {
            background: rgba(37, 99, 235, 0.2);
        }
        
        .correct-answer {
            border-left: 4px solid #10B981;
        }
        .wrong-answer {
            border-left: 4px solid #EF4444;
        }
        
        .skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: skeleton-loading 1.5s ease-in-out infinite;
            border-radius: 0.75rem;
        }
        @keyframes skeleton-loading {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .dark .skeleton {
            background: linear-gradient(90deg, #1a1a2e 25%, #2a2a3e 50%, #1a1a2e 75%);
            background-size: 200% 100%;
        }
        
        .status-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.7rem;
            font-weight: 600;
        }
        .status-draft { background: #E5E7EB; color: #6B7280; }
        .status-published { background: #DBEAFE; color: #2563EB; }
        .status-active { background: #D1FAE5; color: #059669; }
        .status-closed { background: #FEE2E2; color: #DC2626; }
        
        .dark .status-draft { background: #374151; color: #9CA3AF; }
        .dark .status-published { background: #1E3A5F; color: #60A5FA; }
        .dark .status-active { background: #065F46; color: #34D399; }
        .dark .status-closed { background: #7F1D1D; color: #F87171; }
    </style>
</head>

    <script>
        // ============================================
        // SUPABASE CONFIGURATION
        // ============================================
        const SUPABASE_URL = 'https://kfeqmjveemfacrmqrhzk.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_p5OiC1XnOlBLKs2nUYAL1w_LBBh5kDo';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        console.log('✅ Supabase client initialized');

        // ============================================
        // STATE
        // ============================================
        let currentUser = null;
        let userProfile = null;
        let userRole = 'learner';
        let assignments = [];
        let subjects = [];
        let enrollments = [];
        let filteredAssignments = [];
        let questionCount = 0;
        let currentAttempt = null;
        let currentQuestionIndex = 0;
        let timerInterval = null;
        let timeRemaining = 0;

        // ============================================
        // TOAST NOTIFICATIONS
        // ============================================
        function showToast(message, type = 'info', duration = 3000) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.innerHTML = `
                <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-2">
                        ${type === 'success' ? '<i class="fas fa-check-circle"></i>' : ''}
                        ${type === 'error' ? '<i class="fas fa-exclamation-circle"></i>' : ''}
                        ${type === 'warning' ? '<i class="fas fa-exclamation-triangle"></i>' : ''}
                        ${type === 'info' ? '<i class="fas fa-info-circle"></i>' : ''}
                        <span>${message}</span>
                    </div>
                    <button onclick="this.parentElement.parentElement.remove()" class="text-white/80 hover:text-white">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            `;
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(100%)';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, duration);
        }

        // ============================================
        // SIDEBAR TOGGLE
        // ============================================
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('-translate-x-full');
        }

        // ============================================
        // LOGOUT
        // ============================================
        async function logoutUser() {
            try {
                const { error } = await supabaseClient.auth.signOut();
                if (error) throw error;
                
                showToast('Logged out successfully!', 'success');
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1000);
            } catch (error) {
                console.error('Logout error:', error);
                showToast('Error logging out: ' + error.message, 'error');
            }
        }

        // ============================================
        // CHECK AUTHENTICATION
        // ============================================
        async function checkAuth() {
            try {
                const { data: { session }, error } = await supabaseClient.auth.getSession();
                
                if (error) throw error;
                
                if (!session) {
                    console.log('No session found, redirecting to login');
                    window.location.href = 'login.html';
                    return false;
                }
                
                currentUser = session.user;
                console.log('✅ User authenticated:', currentUser.email);
                
                await fetchUserProfile();
                updateUserUI();
                await loadData();
                
                return true;
            } catch (error) {
                console.error('Auth check error:', error);
                window.location.href = 'login.html';
                return false;
            }
        }

        // ============================================
        // FETCH USER PROFILE
        // ============================================
        async function fetchUserProfile() {
            try {
                const { data, error } = await supabaseClient
                    .from('profiles')
                    .select('*')
                    .eq('id', currentUser.id)
                    .single();
                
                if (error) throw error;
                
                userProfile = data;
                userRole = data.role || 'learner';
                console.log('👤 User profile loaded:', userProfile);
                
                return userProfile;
            } catch (error) {
                console.error('Error fetching profile:', error);
                userProfile = {
                    first_name: currentUser.user_metadata?.first_name || 'User',
                    last_name: currentUser.user_metadata?.last_name || '',
                    role: currentUser.user_metadata?.role || 'learner'
                };
                userRole = userProfile.role;
                return userProfile;
            }
        }

        // ============================================
        // UPDATE UI WITH USER INFO
        // ============================================
        function updateUserUI() {
            const firstName = userProfile?.first_name || currentUser?.user_metadata?.first_name || 'User';
            const lastName = userProfile?.last_name || currentUser?.user_metadata?.last_name || '';
            const fullName = `${firstName} ${lastName}`.trim();
            
            document.getElementById('user-name').textContent = fullName || currentUser.email;
            const roleDisplay = userRole.charAt(0).toUpperCase() + userRole.slice(1);
            document.getElementById('user-role').textContent = roleDisplay;
            
            const initials = firstName.charAt(0) + (lastName ? lastName.charAt(0) : '');
            document.getElementById('user-avatar').innerHTML = initials || '<i class="fas fa-user"></i>';
            
            // Show/hide create button based on role
            if (userRole === 'teacher' || userRole === 'admin') {
                document.getElementById('create-assignment-btn').classList.remove('hidden');
            }
        }

        // ============================================
        // LOAD DATA
        // ============================================
        async function loadData() {
            try {
                await loadSubjects();
                await loadEnrollments();
                await loadAssignments();
                populateFilters();
                applyFilters();
            } catch (error) {
                console.error('Error loading data:', error);
                showToast('Error loading assignments data', 'error');
            }
        }

        // ============================================
        // LOAD SUBJECTS
        // ============================================
        async function loadSubjects() {
            try {
                let query = supabaseClient
                    .from('subjects')
                    .select('*');
                
                if (userRole === 'learner') {
                    const { data: enrolls, error: enrollError } = await supabaseClient
                        .from('subject_enrollments')
                        .select('subject_id')
                        .eq('learner_id', currentUser.id)
                        .eq('status', 'active');
                    
                    if (enrollError) throw enrollError;
                    
                    const subjectIds = enrolls?.map(e => e.subject_id) || [];
                    if (subjectIds.length > 0) {
                        query = query.in('id', subjectIds);
                    } else {
                        subjects = [];
                        return;
                    }
                } else {
                    query = query.eq('teacher_id', currentUser.id);
                }
                
                const { data, error } = await query;
                
                if (error) throw error;
                subjects = data || [];
                console.log('📚 Subjects loaded:', subjects.length);
                
                // Populate subject dropdowns
                const selects = ['filter-subject', 'assignment-subject'];
                selects.forEach(id => {
                    const select = document.getElementById(id);
                    const options = select.querySelectorAll('option:not([value=""])');
                    options.forEach(opt => opt.remove());
                    
                    subjects.forEach(subject => {
                        const option = document.createElement('option');
                        option.value = subject.id;
                        option.textContent = subject.name;
                        select.appendChild(option);
                    });
                });
                
                return subjects;
            } catch (error) {
                console.error('Error loading subjects:', error);
                subjects = [];
                return [];
            }
        }

        // ============================================
        // LOAD ENROLLMENTS
        // ============================================
        async function loadEnrollments() {
            try {
                if (userRole !== 'learner') {
                    enrollments = [];
                    return [];
                }
                
                const { data, error } = await supabaseClient
                    .from('subject_enrollments')
                    .select('*')
                    .eq('learner_id', currentUser.id);
                
                if (error) throw error;
                enrollments = data || [];
                return enrollments;
            } catch (error) {
                console.error('Error loading enrollments:', error);
                enrollments = [];
                return [];
            }
        }

        // ============================================
        // LOAD ASSIGNMENTS
        // ============================================
        async function loadAssignments() {
            try {
                let query = supabaseClient
                    .from('assessments')
                    .select(`
                        *,
                        subjects (id, name, color),
                        profiles (first_name, last_name)
                    `)
                    .order('created_at', { ascending: false });
                
                if (userRole === 'learner') {
                    const subjectIds = subjects.map(s => s.id);
                    if (subjectIds.length > 0) {
                        query = query.in('subject_id', subjectIds);
                    } else {
                        assignments = [];
                        return;
                    }
                } else {
                    query = query.eq('teacher_id', currentUser.id);
                }
                
                const { data, error } = await query;
                
                if (error) throw error;
                assignments = data || [];
                console.log('📝 Assignments loaded:', assignments.length);
                return assignments;
            } catch (error) {
                console.error('Error loading assignments:', error);
                assignments = [];
                return [];
            }
        }

        // ============================================

            const element = document.getElementById(questionId);
            if (element) {
                element.remove();
                // Re-number questions
                const questions = document.querySelectorAll('.question-block');
                questions.forEach((q, index) => {
                    const header = q.querySelector('h4');
                    if (header) {

                    }
                });

        // ============================================
        // SAVE ASSIGNMENT
        // ============================================
        document.getElementById('assignment-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const editId = document.getElementById('edit-assignment-id').value;
            const title = document.getElementById('assignment-title').value.trim();
            const description = document.getElementById('assignment-description').value.trim();
            const subjectId = document.getElementById('assignment-subject').value;
            const status = document.getElementById('assignment-status').value;
            const dueDate = document.getElementById('assignment-due').value;
            const timeLimit = parseInt(document.getElementById('assignment-time-limit').value) || 60;
            const totalMarks = parseInt(document.getElementById('assignment-marks').value) || 100;
            const passingMark = parseInt(document.getElementById('assignment-passing').value) || 50;
            
            if (!title || !subjectId) {
                showToast('Please fill in all required fields', 'warning');
                return;
            }
            
            // Collect questions
            const questionBlocks = document.querySelectorAll('.question-block');
            if (questionBlocks.length === 0) {
                showToast('Please add at least one question', 'warning');
                return;
            }
            
            const questions = [];
            let totalQuestionMarks = 0;
            
            questionBlocks.forEach((block, index) => {
                const qNum = index + 1;
                const questionText = block.querySelector(`input[name="question_text_${qNum}"]`)?.value.trim();
                const questionType = block.querySelector(`select[name="question_type_${qNum}"]`)?.value || 'multiple_choice';
                const marks = parseInt(block.querySelector(`input[name="question_marks_${qNum}"]`)?.value) || 1;
                
                if (!questionText) {
                    showToast(`Question ${qNum} text is required`, 'warning');
                    return;
                }
                
                const questionData = {
                    text: questionText,
                    type: questionType,
                    marks: marks,
                    choices: [],
                    correctAnswer: null
                };
                
                // Get correct answer
                const correctRadio = block.querySelector(`input[name="correct_${qNum}"]:checked`);
                if (correctRadio) {
                    questionData.correctAnswer = parseInt(correctRadio.value);
                }
                
                // Get choices for multiple choice
                if (questionType === 'multiple_choice' || questionType === 'true_false') {
                    const choiceInputs = block.querySelectorAll(`input[name^="choice_${qNum}_"]`);
                    choiceInputs.forEach((input, idx) => {
                        const choiceText = input.value.trim();
                        if (choiceText) {
                            questionData.choices.push(choiceText);
                        }
                    });
                }
                
                totalQuestionMarks += marks;
                questions.push(questionData);
            });
            
            if (questions.length === 0) {
                showToast('Please add valid questions', 'warning');
                return;
            }
            
            const btn = document.getElementById('save-assignment-btn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner spinner mr-2"></i> Saving...';
            
            try {
                // Save assignment
                const assignmentData = {
                    title,
                    description,
                    subject_id: subjectId,
                    teacher_id: currentUser.id,
                    assessment_type: 'assignment',
                    status: status || 'draft',
                    closing_date: dueDate || null,
                    time_limit: timeLimit,
                    total_marks: totalMarks,
                    passing_mark: passingMark,
                    question_count: questions.length
                };
                
                let assignmentResult;
                
                if (editId) {
                    const { data, error } = await supabaseClient
                        .from('assessments')
                        .update(assignmentData)
                        .eq('id', editId)
                        .select();
                    
                    if (error) throw error;
                    assignmentResult = data;
                } else {
                    const { data, error } = await supabaseClient
                        .from('assessments')
                        .insert([assignmentData])
                        .select();
                    
                    if (error) throw error;
                    assignmentResult = data;
                }
                
                const assignmentId = assignmentResult[0].id;
                
                // Save questions
                for (let i = 0; i < questions.length; i++) {
                    const q = questions[i];
                    const questionData = {
                        assessment_id: assignmentId,
                        question_text: q.text,
                        question_type: q.type,
                        marks: q.marks,
                        sort_order: i + 1
                    };
                    
                    const { data: questionResult, error: qError } = await supabaseClient
                        .from('questions')
                        .insert([questionData])
                        .select();
                    
                    if (qError) throw qError;
                    
                    const questionId = questionResult[0].id;
                    
                    // Save choices
                    if (q.choices && q.choices.length > 0) {
                        for (let j = 0; j < q.choices.length; j++) {
                            const choiceData = {
                                question_id: questionId,
                                choice_text: q.choices[j],
                                is_correct: (j + 1) === q.correctAnswer,
                                sort_order: j + 1
                            };
                            
                            const { error: cError } = await supabaseClient
                                .from('choices')
                                .insert([choiceData]);
                            
                            if (cError) throw cError;
                        }
                    }
                }
                
                showToast(editId ? 'Assignment updated successfully! ✅' : 'Assignment created successfully! 🎉', 'success');
                closeModal();
                await loadData();
                
            } catch (error) {
                console.error('Error saving assignment:', error);
                showToast('Error saving assignment: ' + error.message, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-save mr-2"></i> Save Assignment';
            }
        });

        // ============================================
        // EDIT ASSIGNMENT
        // ============================================
        function editAssignment(assignmentId) {
            // For now, just show a message since full edit would require loading existing questions
            showToast('Edit functionality - Please create a new assignment for now', 'info');
        }

        // ============================================
        // VIEW ASSIGNMENT
        // ============================================
        function viewAssignment(assignmentId) {
            showToast('View assignment details coming soon', 'info');
        }

        // ============================================
        // DELETE ASSIGNMENT
        // ============================================
        async function deleteAssignment(assignmentId) {
            if (!confirm('Are you sure you want to delete this assignment?')) return;
            
            try {
                const { error } = await supabaseClient
                    .from('assessments')
                    .delete()
                    .eq('id', assignmentId);
                
                if (error) throw error;
                
                showToast('Assignment deleted successfully', 'success');
                await loadData();
            } catch (error) {
                console.error('Error deleting assignment:', error);
                showToast('Error deleting assignment: ' + error.message, 'error');
            }
        }

        // ============================================
        // ATTEMPT ASSIGNMENT
        // ============================================
        async function attemptAssignment(assignmentId) {
            const assignment = assignments.find(a => a.id === assignmentId);
            if (!assignment) {
                showToast('Assignment not found', 'error');
                return;
            }
            
            // Load questions
            try {
                const { data: questions, error } = await supabaseClient
                    .from('questions')
                    .select(`
                        *,
                        choices (*)
                    `)
                    .eq('assessment_id', assignmentId)
                    .order('sort_order', { ascending: true });
                
                if (error) throw error;
                
                if (!questions || questions.length === 0) {
                    showToast('No questions found for this assignment', 'error');
                    return;
                }
                
                currentAttempt = {
                    assignment: assignment,
                    questions: questions,
                    answers: {},
                    startedAt: new Date()
                };
                
                currentQuestionIndex = 0;
                timeRemaining = (assignment.time_limit || 60) * 60;
                
                document.getElementById('attempt-title').textContent = assignment.title;
                document.getElementById('attempt-modal').classList.add('active');
                
                renderQuestion();
                startTimer();
                
            } catch (error) {
                console.error('Error loading questions:', error);
                showToast('Error loading questions: ' + error.message, 'error');
            }
        }

        // ============================================
        // RENDER QUESTION
        // ============================================
        function renderQuestion() {
            const questions = currentAttempt.questions;
            const q = questions[currentQuestionIndex];
            const total = questions.length;
            
            document.getElementById('question-progress').textContent = `Question ${currentQuestionIndex + 1} of ${total}`;
            
            // Show/hide navigation buttons
            document.getElementById('prev-question').classList.toggle('hidden', currentQuestionIndex === 0);
            document.getElementById('next-question').classList.toggle('hidden', currentQuestionIndex === total - 1);
            
            const content = document.getElementById('attempt-content');
            
            let choicesHtml = '';
            if (q.question_type === 'multiple_choice' && q.choices) {
                const selected = currentAttempt.answers[q.id] || null;
                choicesHtml = q.choices.map((choice, idx) => `
                    <div class="choice-option ${selected === idx ? 'selected' : ''}" onclick="selectChoice(${q.id}, ${idx})">
                        <span class="w-6 h-6 rounded-full border-2 ${selected === idx ? 'border-blue-600 bg-blue-600 text-white' : 'border-gray-300 dark:border-gray-600'} flex items-center justify-center text-xs font-bold">
                            ${String.fromCharCode(65 + idx)}
                        </span>
                        <span class="text-gray-700 dark:text-gray-300">${choice.choice_text}</span>
                    </div>
                `).join('');
            } else if (q.question_type === 'true_false') {
                const selected = currentAttempt.answers[q.id] || null;
                const trueFalseOptions = ['True', 'False'];
                choicesHtml = trueFalseOptions.map((text, idx) => `
                    <div class="choice-option ${selected === idx ? 'selected' : ''}" onclick="selectChoice(${q.id}, ${idx})">
                        <span class="w-6 h-6 rounded-full border-2 ${selected === idx ? 'border-blue-600 bg-blue-600 text-white' : 'border-gray-300 dark:border-gray-600'} flex items-center justify-center text-xs font-bold">
                            ${idx === 0 ? 'T' : 'F'}
                        </span>
                        <span class="text-gray-700 dark:text-gray-300">${text}</span>
                    </div>
                `).join('');
            } else {
                const answer = currentAttempt.answers[q.id] || '';
                choicesHtml = `
                    <textarea rows="4" onchange="saveShortAnswer(${q.id}, this.value)" 
                              class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-white dark:bg-gray-700 text-gray-900 dark:text-white">${answer}</textarea>
                `;
            }
            
            content.innerHTML = `
                <div class="mb-4">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-sm font-medium text-gray-500 dark:text-gray-400">${q.question_type.replace('_', ' ').toUpperCase()}</span>
                        <span class="text-sm font-medium text-gray-500 dark:text-gray-400">${q.marks} marks</span>
                    </div>
                    <h3 class="text-lg font-semibold text-gray-900 dark:text-white">${q.question_text}</h3>
                </div>
                <div class="space-y-2">
                    ${choicesHtml}
                </div>
            `;
        }

        // ============================================
        // SELECT CHOICE
        // ============================================
        function selectChoice(questionId, choiceIndex) {
            currentAttempt.answers[questionId] = choiceIndex;
            renderQuestion();
        }

        // ============================================
        // SAVE SHORT ANSWER
        // ============================================
        function saveShortAnswer(questionId, value) {
            currentAttempt.answers[questionId] = value;
        }

        // ============================================
        // CHANGE QUESTION
        // ============================================
        function changeQuestion(delta) {
            const newIndex = currentQuestionIndex + delta;
            if (newIndex >= 0 && newIndex < currentAttempt.questions.length) {
                currentQuestionIndex = newIndex;
                renderQuestion();
            }
        }

        // ============================================
        // START TIMER
        // ============================================
        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            
            timerInterval = setInterval(() => {
                timeRemaining--;
                const minutes = Math.floor(timeRemaining / 60);
                const seconds = timeRemaining % 60;
                document.getElementById('attempt-timer').textContent = `⏱ ${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
                
                if (timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    showToast('Time is up! Submitting automatically...', 'warning');
                    submitAssignment();
                }
            }, 1000);
        }

        // ============================================
        // SUBMIT ASSIGNMENT
        // ============================================
        async function submitAssignment() {
            if (timerInterval) clearInterval(timerInterval);
            
            if (!confirm('Are you sure you want to submit this assignment?')) {
                startTimer();
                return;
            }
            
            const questions = currentAttempt.questions;
            let totalScore = 0;
            let totalPossible = 0;
            let results = [];
            
            questions.forEach(q => {
                const marks = q.marks || 1;
                totalPossible += marks;
                
                const userAnswer = currentAttempt.answers[q.id];
                let isCorrect = false;
                let correctAnswer = null;
                
                if (q.question_type === 'multiple_choice' || q.question_type === 'true_false') {
                    const correctChoice = q.choices?.findIndex(c => c.is_correct) ?? -1;
                    correctAnswer = correctChoice >= 0 ? correctChoice : null;
                    isCorrect = userAnswer === correctAnswer;
                } else {
                    // For short answer and essay, we need manual grading
                    // For now, mark as pending
                    isCorrect = false;
                }
                
                if (isCorrect) {
                    totalScore += marks;
                }
                
                results.push({
                    questionId: q.id,
                    questionText: q.question_text,
                    userAnswer: userAnswer,
                    correctAnswer: correctAnswer,
                    isCorrect: isCorrect,
                    marks: marks,
                    earnedMarks: isCorrect ? marks : 0
                });
            });
            
            const percentage = totalPossible > 0 ? (totalScore / totalPossible) * 100 : 0;
            const passed = percentage >= (currentAttempt.assignment.passing_mark || 50);
            const grade = percentage >= 80 ? 'A' : percentage >= 70 ? 'B' : percentage >= 60 ? 'C' : percentage >= 50 ? 'D' : 'F';
            
            try {
                // Save submission
                const { data: submission, error } = await supabaseClient
                    .from('submissions')
                    .insert([{
                        assessment_id: currentAttempt.assignment.id,
                        learner_id: currentUser.id,
                        submitted_at: new Date().toISOString(),
                        status: 'graded',
                        total_score: totalScore,
                        total_marks: totalPossible,
                        percentage: percentage,
                        grade: grade,
                        passed: passed,
                        time_taken: Math.floor((new Date() - currentAttempt.startedAt) / 1000)
                    }])
                    .select();
                
                if (error) throw error;
                
                // Save answers
                for (const result of results) {
                    await supabaseClient
                        .from('answers')
                        .insert([{
                            submission_id: submission[0].id,
                            question_id: result.questionId,
                            answer_text: typeof result.userAnswer === 'number' ? String.fromCharCode(65 + result.userAnswer) : result.userAnswer,
                            is_correct: result.isCorrect,
                            score: result.earnedMarks
                        }]);
                }
                
                closeAttemptModal();
                showToast('Assignment submitted successfully! 🎉', 'success');
                showResults(results, totalScore, totalPossible, percentage, grade, passed);
                
                await loadData();
                
            } catch (error) {
                console.error('Error submitting assignment:', error);
                showToast('Error submitting assignment: ' + error.message, 'error');
            }
        }

        // ============================================
        // SHOW RESULTS
        // ============================================
        function showResults(results, totalScore, totalPossible, percentage, grade, passed) {
            const content = document.getElementById('results-content');
            content.innerHTML = `
                <div class="gradient-bg rounded-2xl p-6 text-white text-center">
                    <div class="text-5xl font-bold mb-2">${percentage.toFixed(0)}%</div>
                    <div class="text-2xl font-bold mb-1">Grade: ${grade}</div>
                    <div class="text-lg">${passed ? '✅ PASSED' : '❌ FAILED'}</div>
                    <div class="text-sm opacity-80 mt-2">${totalScore} / ${totalPossible} marks</div>
                </div>
                
                <div class="space-y-3 max-h-96 overflow-y-auto">
                    ${results.map((r, idx) => `
                        <div class="p-4 rounded-xl ${r.isCorrect ? 'correct-answer' : 'wrong-answer'} bg-gray-50 dark:bg-gray-800">
                            <div class="flex items-start justify-between">
                                <div>
                                    <div class="text-sm font-medium text-gray-500 dark:text-gray-400">Question ${idx + 1}</div>
                                    <div class="text-gray-900 dark:text-white">${r.questionText}</div>
                                    <div class="text-sm mt-1">
                                        <span class="text-gray-500 dark:text-gray-400">Your answer: </span>
                                        <span class="font-medium">${typeof r.userAnswer === 'number' ? String.fromCharCode(65 + r.userAnswer) : r.userAnswer || 'Not answered'}</span>
                                        ${r.correctAnswer !== null && r.correctAnswer !== undefined ? `
                                            <span class="text-gray-500 dark:text-gray-400 ml-2">Correct: </span>
                                            <span class="font-medium text-green-600 dark:text-green-400">${typeof r.correctAnswer === 'number' ? String.fromCharCode(65 + r.correctAnswer) : r.correctAnswer}</span>
                                        ` : ''}
                                    </div>
                                </div>
                                <div class="text-right">
                                    <div class="text-lg font-bold ${r.isCorrect ? 'text-green-600 dark:text-green-400' : 'text-red-600 dark:text-red-400'}">
                                        ${r.earnedMarks} / ${r.marks}
                                    </div>
                                    <div class="text-sm ${r.isCorrect ? 'text-green-600 dark:text-green-400' : 'text-red-600 dark:text-red-400'}">
                                        ${r.isCorrect ? '✅' : '❌'}
                                    </div>
                                </div>
                            </div>
                        </div>
                    `).join('')}
                </div>
                
                <button onclick="closeResultsModal()" class="w-full btn-primary py-3 rounded-xl text-white font-semibold">
                    Close
                </button>
            `;
            
            document.getElementById('results-modal').classList.add('active');
        }

        // ============================================
        // CLOSE MODALS
        // ============================================
        function closeModal() {
            document.getElementById('assignment-modal').classList.remove('active');
        }

        function closeAttemptModal() {
            document.getElementById('attempt-modal').classList.remove('active');
            if (timerInterval) clearInterval(timerInterval);
            currentAttempt = null;
        }

        function closeResultsModal() {
            document.getElementById('results-modal').classList.remove('active');
        }

        // ============================================
        // DARK MODE
        // ============================================
        function toggleDarkMode() {
            const html = document.documentElement;
            const isDark = html.classList.toggle('dark');
            localStorage.setItem('darkMode', isDark ? 'true' : 'false');
            updateDarkModeIcon(isDark);
        }

        function updateDarkModeIcon(isDark) {
            const icon = document.getElementById('dark-mode-icon');
            icon.className = isDark ? 'fas fa-sun' : 'fas fa-moon';
        }

        function initDarkMode() {
            const saved = localStorage.getItem('darkMode');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const isDark = saved ? saved === 'true' : prefersDark;
            if (isDark) {
                document.documentElement.classList.add('dark');
                updateDarkModeIcon(true);
            }
        }

        // ============================================
        // CLOSE MODAL ON OVERLAY CLICK
        // ============================================
        document.getElementById('assignment-modal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });
        document.getElementById('attempt-modal').addEventListener('click', function(e) {
            if (e.target === this) closeAttemptModal();
        });
        document.getElementById('results-modal').addEventListener('click', function(e) {
            if (e.target === this) closeResultsModal();
        });

        // ============================================
        // KEYBOARD SHORTCUTS
        // ============================================
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
                closeAttemptModal();
                closeResultsModal();
            }
        });

        // ============================================
        // INITIALIZATION
        // ============================================
        (async function init() {
            console.log('🚀 CastroEduConnect Assignments Page Loading...');
            
            initDarkMode();
            document.getElementById('dark-mode-toggle').addEventListener('click', toggleDarkMode);
            
            const isAuth = await checkAuth();
            
            if (!isAuth) {
                console.log('❌ Not authenticated, redirecting...');
                window.location.href = 'login.html';
                return;
            }
            
            console.log('✅ Assignments page initialized successfully');
        })();
    </script>
</body>
</html>
