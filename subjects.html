<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Subjects - CastroEduConnect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        .sidebar-link {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            color: #6b7280;
            transition: all 0.3s ease;
            cursor: pointer;
            text-decoration: none;
        }
        .sidebar-link:hover {
            background: rgba(37, 99, 235, 0.1);
            color: #2563EB;
        }
        .sidebar-link.active {
            background: linear-gradient(135deg, #2563EB, #4F46E5);
            color: white;
        }
        .dark .sidebar-link {
            color: #9ca3af;
        }
        .dark .sidebar-link:hover {
            background: rgba(37, 99, 235, 0.2);
            color: #60a5fa;
        }
        
        .gradient-bg {
            background: linear-gradient(135deg, #2563EB 0%, #4F46E5 50%, #7C3AED 100%);
        }
        
        .subject-card {
            background: white;
            border-radius: 1.5rem;
            padding: 1.5rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
            border-left: 4px solid #2563EB;
        }
        .subject-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 30px rgba(37, 99, 235, 0.15);
        }
        .dark .subject-card {
            background: #1a1a2e;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        
        .spinner {
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .toast-container {
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .toast {
            padding: 1rem 1.5rem;
            border-radius: 0.75rem;
            color: white;
            animation: slideInRight 0.5s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            min-width: 300px;
            max-width: 450px;
        }
        .toast-success { background: #10B981; }
        .toast-error { background: #EF4444; }
        .toast-warning { background: #F59E0B; }
        .toast-info { background: #3B82F6; }
        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 9998;
            display: none;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-content {
            background: white;
            border-radius: 2rem;
            padding: 2rem;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            animation: modalPop 0.3s ease;
        }
        .dark .modal-content {
            background: #1a1a2e;
        }
        @keyframes modalPop {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900">
    <!-- Sidebar -->
    <aside class="fixed left-0 top-0 h-full w-64 bg-white dark:bg-gray-800 shadow-xl z-50 transition-transform -translate-x-full md:translate-x-0" id="sidebar">
        <div class="p-6">
            <div class="flex items-center space-x-3 mb-8">
                <div class="w-10 h-10 gradient-bg rounded-xl flex items-center justify-center">
                    <i class="fas fa-graduation-cap text-white text-xl"></i>
                </div>
                <span class="text-xl font-bold text-gray-900 dark:text-white">CastroEduConnect</span>
            </div>
            
            <nav class="space-y-1">
                <a href="dashboard.html" class="sidebar-link">
                    <i class="fas fa-th-large w-5"></i> Dashboard
                </a>
                <a href="subjects.html" class="sidebar-link active">
                    <i class="fas fa-book w-5"></i> Subjects
                </a>
                <a href="assignments.html" class="sidebar-link">
                    <i class="fas fa-tasks w-5"></i> Assignments
                </a>
                <a href="assessments.html" class="sidebar-link">
                    <i class="fas fa-question-circle w-5"></i> Assessments
                </a>
                <a href="results.html" class="sidebar-link">
                    <i class="fas fa-chart-bar w-5"></i> Results
                </a>
                <a href="resources.html" class="sidebar-link">
                    <i class="fas fa-folder w-5"></i> Resources
                </a>
                <a href="announcements.html" class="sidebar-link">
                    <i class="fas fa-bullhorn w-5"></i> Announcements
                </a>
                <a href="profile.html" class="sidebar-link">
                    <i class="fas fa-user w-5"></i> Profile
                </a>
                <a href="settings.html" class="sidebar-link">
                    <i class="fas fa-cog w-5"></i> Settings
                </a>
                <button onclick="logoutUser()" class="sidebar-link w-full text-left text-red-500 hover:text-red-600 hover:bg-red-50 dark:hover:bg-red-900/20">
                    <i class="fas fa-sign-out-alt w-5"></i> Logout
                </button>
            </nav>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="md:ml-64 min-h-screen">
        <!-- Top Bar -->
        <header class="bg-white dark:bg-gray-800 shadow-sm sticky top-0 z-40 border-b border-gray-200 dark:border-gray-700">
            <div class="flex items-center justify-between px-6 py-4">
                <div class="flex items-center space-x-4">
                    <button onclick="toggleSidebar()" class="md:hidden text-gray-600 dark:text-gray-300 text-2xl">
                        <i class="fas fa-bars"></i>
                    </button>
                    <h1 class="text-xl font-bold text-gray-900 dark:text-white">My Subjects</h1>
                </div>
                
                <div class="flex-1 max-w-xl mx-4">
                    <div class="relative">
                        <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                        <input type="text" id="search-input" placeholder="Search subjects..." 
                               class="w-full pl-10 pr-4 py-2 border border-gray-200 dark:border-gray-700 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-white" />
                    </div>
                </div>
                
                <div class="flex items-center space-x-4">
                    <button id="dark-mode-toggle" class="text-gray-600 dark:text-gray-300 hover:text-blue-600 text-xl">
                        <i id="dark-mode-icon" class="fas fa-moon"></i>
                    </button>
                    <button onclick="showToast('You have 3 new notifications', 'info')" 
                            class="relative text-gray-600 dark:text-gray-300 hover:text-blue-600">
                        <i class="fas fa-bell text-xl"></i>
                        <span class="absolute -top-1 -right-1 w-5 h-5 bg-red-500 rounded-full text-white text-xs flex items-center justify-center">3</span>
                    </button>
                    <div class="flex items-center space-x-3 cursor-pointer" onclick="window.location.href='profile.html'">
                        <div id="user-avatar" class="w-10 h-10 gradient-bg rounded-full flex items-center justify-center text-white font-semibold">
                            <i class="fas fa-user"></i>
                        </div>
                        <div class="hidden sm:block">
                            <div id="user-name" class="text-sm font-semibold text-gray-900 dark:text-white">Loading...</div>
                            <div id="user-role" class="text-xs text-gray-500 dark:text-gray-400">Loading...</div>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <!-- Content -->
        <div class="p-6">
            <!-- Actions -->
            <div class="flex flex-wrap items-center justify-between gap-4 mb-6">
                <div class="flex items-center space-x-3">
                    <select id="filter-grade" class="px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-xl bg-white dark:bg-gray-700 text-gray-900 dark:text-white">
                        <option value="">All Grades</option>
                    </select>
                    <select id="filter-status" class="px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-xl bg-white dark:bg-gray-700 text-gray-900 dark:text-white">
                        <option value="">All Status</option>
                        <option value="active">Active</option>
                        <option value="completed">Completed</option>
                        <option value="dropped">Dropped</option>
                    </select>
                </div>
                <button onclick="openAddSubjectModal()" class="btn-primary px-6 py-2 rounded-xl text-white font-semibold flex items-center space-x-2">
                    <i class="fas fa-plus"></i> <span>Add Subject</span>
                </button>
            </div>

            <!-- Subjects Grid -->
            <div id="subjects-container" class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Loading Skeletons -->
                <div class="subject-card">
                    <div class="skeleton h-8 w-3/4 mb-4"></div>
                    <div class="skeleton h-4 w-1/2 mb-2"></div>
                    <div class="skeleton h-4 w-2/3 mb-4"></div>
                    <div class="skeleton h-2 w-full mb-4"></div>
                    <div class="skeleton h-10 w-full"></div>
                </div>
                <div class="subject-card">
                    <div class="skeleton h-8 w-3/4 mb-4"></div>
                    <div class="skeleton h-4 w-1/2 mb-2"></div>
                    <div class="skeleton h-4 w-2/3 mb-4"></div>
                    <div class="skeleton h-2 w-full mb-4"></div>
                    <div class="skeleton h-10 w-full"></div>
                </div>
                <div class="subject-card">
                    <div class="skeleton h-8 w-3/4 mb-4"></div>
                    <div class="skeleton h-4 w-1/2 mb-2"></div>
                    <div class="skeleton h-4 w-2/3 mb-4"></div>
                    <div class="skeleton h-2 w-full mb-4"></div>
                    <div class="skeleton h-10 w-full"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- Add/Edit Subject Modal -->
    <div id="subject-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="flex items-center justify-between mb-6">
                <h2 id="modal-title" class="text-2xl font-bold text-gray-900 dark:text-white">Add New Subject</h2>
                <button onclick="closeModal()" class="text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200 text-2xl">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            
            <form id="subject-form">
                <input type="hidden" id="edit-subject-id" />
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Subject Name</label>
                        <input type="text" id="subject-name" required 
                               class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-white dark:bg-gray-700 text-gray-900 dark:text-white" />
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Subject Code</label>
                        <input type="text" id="subject-code" required 
                               class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-white dark:bg-gray-700 text-gray-900 dark:text-white" />
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Description</label>
                        <textarea id="subject-description" rows="3" 
                                  class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-white dark:bg-gray-700 text-gray-900 dark:text-white"></textarea>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Grade</label>
                        <select id="subject-grade" required 
                                class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-white dark:bg-gray-700 text-gray-900 dark:text-white">
                            <option value="">Select Grade</option>
                        </select>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Color</label>
                        <input type="color" id="subject-color" value="#2563EB" 
                               class="w-full h-12 border border-gray-300 dark:border-gray-600 rounded-xl cursor-pointer" />
                    </div>
                    
                    <button type="submit" id="save-subject-btn" 
                            class="w-full btn-primary py-3 rounded-xl text-white font-semibold text-lg">
                        <i class="fas fa-save mr-2"></i> Save Subject
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <script>
        // ============================================
        // SUPABASE CONFIGURATION
        // ============================================
        const SUPABASE_URL = 'https://kfeqmjveemfacrmqrhzk.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_p5OiC1XnOlBLKs2nUYAL1w_LBBh5kDo';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        console.log('✅ Supabase client initialized');

        // ============================================
        // STATE
        // ============================================
        let currentUser = null;
        let userProfile = null;
        let userRole = 'learner';
        let subjects = [];
        let grades = [];
        let enrollments = [];

        // ============================================
        // TOAST NOTIFICATIONS
        // ============================================
        function showToast(message, type = 'info', duration = 3000) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.innerHTML = `
                <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-2">
                        ${type === 'success' ? '<i class="fas fa-check-circle"></i>' : ''}
                        ${type === 'error' ? '<i class="fas fa-exclamation-circle"></i>' : ''}
                        ${type === 'warning' ? '<i class="fas fa-exclamation-triangle"></i>' : ''}
                        ${type === 'info' ? '<i class="fas fa-info-circle"></i>' : ''}
                        <span>${message}</span>
                    </div>
                    <button onclick="this.parentElement.parentElement.remove()" class="text-white/80 hover:text-white">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            `;
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(100%)';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, duration);
        }

        // ============================================
        // SIDEBAR TOGGLE
        // ============================================
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('-translate-x-full');
        }

        // ============================================
        // LOGOUT
        // ============================================
        async function logoutUser() {
            try {
                const { error } = await supabaseClient.auth.signOut();
                if (error) throw error;
                
                showToast('Logged out successfully!', 'success');
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1000);
            } catch (error) {
                console.error('Logout error:', error);
                showToast('Error logging out: ' + error.message, 'error');
            }
        }

        // ============================================
        // CHECK AUTHENTICATION
        // ============================================
        async function checkAuth() {
            try {
                const { data: { session }, error } = await supabaseClient.auth.getSession();
                
                if (error) throw error;
                
                if (!session) {
                    console.log('No session found, redirecting to login');
                    window.location.href = 'login.html';
                    return false;
                }
                
                currentUser = session.user;
                console.log('✅ User authenticated:', currentUser.email);
                
                await fetchUserProfile();
                updateUserUI();
                await loadData();
                
                return true;
            } catch (error) {
                console.error('Auth check error:', error);
                window.location.href = 'login.html';
                return false;
            }
        }

        // ============================================
        // FETCH USER PROFILE
        // ============================================
        async function fetchUserProfile() {
            try {
                const { data, error } = await supabaseClient
                    .from('profiles')
                    .select('*')
                    .eq('id', currentUser.id)
                    .single();
                
                if (error) throw error;
                
                userProfile = data;
                userRole = data.role || 'learner';
                console.log('👤 User profile loaded:', userProfile);
                
                return userProfile;
            } catch (error) {
                console.error('Error fetching profile:', error);
                userProfile = {
                    first_name: currentUser.user_metadata?.first_name || 'User',
                    last_name: currentUser.user_metadata?.last_name || '',
                    role: currentUser.user_metadata?.role || 'learner'
                };
                userRole = userProfile.role;
                return userProfile;
            }
        }

        // ============================================
        // UPDATE UI WITH USER INFO
        // ============================================
        function updateUserUI() {
            const firstName = userProfile?.first_name || currentUser?.user_metadata?.first_name || 'User';
            const lastName = userProfile?.last_name || currentUser?.user_metadata?.last_name || '';
            const fullName = `${firstName} ${lastName}`.trim();
            
            document.getElementById('user-name').textContent = fullName || currentUser.email;
            const roleDisplay = userRole.charAt(0).toUpperCase() + userRole.slice(1);
            document.getElementById('user-role').textContent = roleDisplay;
            
            const initials = firstName.charAt(0) + (lastName ? lastName.charAt(0) : '');
            document.getElementById('user-avatar').innerHTML = initials || '<i class="fas fa-user"></i>';
        }

        // ============================================
        // LOAD DATA
        // ============================================
        async function loadData() {
            try {
                await loadGrades();
                await loadSubjects();
                await loadEnrollments();
                renderSubjects();
                populateFilters();
            } catch (error) {
                console.error('Error loading data:', error);
                showToast('Error loading subjects data', 'error');
            }
        }

        // ============================================
        // LOAD GRADES
        // ============================================
        async function loadGrades() {
            try {
                const { data, error } = await supabaseClient
                    .from('grades')
                    .select('*')
                    .order('sort_order', { ascending: true });
                
                if (error) throw error;
                grades = data || [];
                console.log('📚 Grades loaded:', grades.length);
                return grades;
            } catch (error) {
                console.error('Error loading grades:', error);
                grades = [];
                return [];
            }
        }

        // ============================================
        // LOAD SUBJECTS
        // ============================================
        async function loadSubjects() {
            try {
                let query = supabaseClient
                    .from('subjects')
                    .select(`
                        *,
                        grades (name, code),
                        profiles (first_name, last_name)
                    `);
                
                // If learner, only show enrolled subjects
                if (userRole === 'learner') {
                    const { data: enrolls, error: enrollError } = await supabaseClient
                        .from('subject_enrollments')
                        .select('subject_id')
                        .eq('learner_id', currentUser.id)
                        .eq('status', 'active');
                    
                    if (enrollError) throw enrollError;
                    
                    const subjectIds = enrolls?.map(e => e.subject_id) || [];
                    if (subjectIds.length > 0) {
                        query = query.in('id', subjectIds);
                    } else {
                        // No subjects enrolled
                        subjects = [];
                        return;
                    }
                }
                
                const { data, error } = await query;
                
                if (error) throw error;
                subjects = data || [];
                console.log('📖 Subjects loaded:', subjects.length);
                return subjects;
            } catch (error) {
                console.error('Error loading subjects:', error);
                subjects = [];
                return [];
            }
        }

        // ============================================
        // LOAD ENROLLMENTS
        // ============================================
        async function loadEnrollments() {
            try {
                const { data, error } = await supabaseClient
                    .from('subject_enrollments')
                    .select('*')
                    .eq('learner_id', currentUser.id);
                
                if (error) throw error;
                enrollments = data || [];
                return enrollments;
            } catch (error) {
                console.error('Error loading enrollments:', error);
                enrollments = [];
                return [];
            }
        }

        // ============================================
        // RENDER SUBJECTS
        // ============================================
        function renderSubjects() {
            const container = document.getElementById('subjects-container');
            
            if (!subjects || subjects.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full text-center py-12">
                        <i class="fas fa-book-open text-6xl text-gray-300 dark:text-gray-600 mb-4"></i>
                        <h3 class="text-xl font-semibold text-gray-900 dark:text-white">No Subjects Found</h3>
                        <p class="text-gray-500 dark:text-gray-400 mt-2">
                            ${userRole === 'learner' ? 'You are not enrolled in any subjects yet.' : 'No subjects have been created yet.'}
                        </p>
                        ${userRole !== 'learner' ? `
                            <button onclick="openAddSubjectModal()" class="mt-4 btn-primary px-6 py-2 rounded-xl text-white font-semibold">
                                <i class="fas fa-plus mr-2"></i> Create First Subject
                            </button>
                        ` : ''}
                    </div>
                `;
                return;
            }
            
            container.innerHTML = subjects.map(subject => {
                const gradeName = subject.grades?.name || 'N/A';
                const teacherName = subject.profiles?.first_name && subject.profiles?.last_name 
                    ? `${subject.profiles.first_name} ${subject.profiles.last_name}`
                    : 'No teacher assigned';
                
                // Find enrollment status
                const enrollment = enrollments.find(e => e.subject_id === subject.id);
                const status = enrollment?.status || 'not_enrolled';
                const statusColors = {
                    'active': 'bg-green-100 dark:bg-green-900/30 text-green-600 dark:text-green-400',
                    'completed': 'bg-blue-100 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400',
                    'dropped': 'bg-red-100 dark:bg-red-900/30 text-red-600 dark:text-red-400',
                    'not_enrolled': 'bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-400'
                };
                const statusLabels = {
                    'active': 'Active',
                    'completed': 'Completed',
                    'dropped': 'Dropped',
                    'not_enrolled': 'Not Enrolled'
                };
                
                // Calculate progress (mock data for now)
                const progress = Math.floor(Math.random() * 100);
                
                return `
                    <div class="subject-card" style="border-left-color: ${subject.color || '#2563EB'}">
                        <div class="flex items-start justify-between mb-4">
                            <div class="flex items-center space-x-3">
                                <div class="w-12 h-12 rounded-xl flex items-center justify-center" 
                                     style="background: ${subject.color || '#2563EB'}20; color: ${subject.color || '#2563EB'}">
                                    <i class="fas fa-book text-2xl"></i>
                                </div>
                                <div>
                                    <h3 class="text-lg font-bold text-gray-900 dark:text-white">${subject.name}</h3>
                                    <p class="text-sm text-gray-500 dark:text-gray-400">${subject.code}</p>
                                </div>
                            </div>
                            <span class="text-xs px-3 py-1 rounded-full ${statusColors[status]}">
                                ${statusLabels[status]}
                            </span>
                        </div>
                        
                        <p class="text-sm text-gray-600 dark:text-gray-400 mb-2">${subject.description || 'No description available'}</p>
                        
                        <div class="flex items-center justify-between text-sm text-gray-500 dark:text-gray-400 mb-3">
                            <span><i class="fas fa-graduation-cap mr-1"></i> ${gradeName}</span>
                            <span><i class="fas fa-user mr-1"></i> ${teacherName}</span>
                        </div>
                        
                        <div class="mb-3">
                            <div class="flex items-center justify-between text-sm">
                                <span class="text-gray-600 dark:text-gray-400">Progress: ${progress}%</span>
                                <span class="text-gray-600 dark:text-gray-400">${status === 'completed' ? '✅ Complete' : 'In Progress'}</span>
                            </div>
                            <div class="w-full bg-gray-200 dark:bg-gray-700 rounded-full h-2 mt-1">
                                <div class="h-2 rounded-full transition-all" 
                                     style="width: ${progress}%; background: ${subject.color || '#2563EB'}"></div>
                            </div>
                        </div>
                        
                        <div class="flex items-center space-x-2">
                            <button onclick="viewSubject('${subject.id}')" 
                                    class="flex-1 py-2 border border-blue-600 text-blue-600 dark:border-blue-400 dark:text-blue-400 rounded-xl hover:bg-blue-50 dark:hover:bg-blue-900/20 transition font-medium text-sm">
                                <i class="fas fa-eye mr-1"></i> View
                            </button>
                            ${userRole !== 'learner' ? `
                                <button onclick="editSubject('${subject.id}')" 
                                        class="flex-1 py-2 border border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-300 rounded-xl hover:bg-gray-100 dark:hover:bg-gray-700 transition font-medium text-sm">
                                    <i class="fas fa-edit mr-1"></i> Edit
                                </button>
                                <button onclick="deleteSubject('${subject.id}')" 
                                        class="py-2 px-3 border border-red-300 dark:border-red-700 text-red-600 dark:text-red-400 rounded-xl hover:bg-red-50 dark:hover:bg-red-900/20 transition font-medium text-sm">
                                    <i class="fas fa-trash"></i>
                                </button>
                            ` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // ============================================
        // POPULATE FILTERS
        // ============================================
        function populateFilters() {
            // Populate grade filter
            const gradeSelect = document.getElementById('filter-grade');
            const gradeOptions = gradeSelect.querySelectorAll('option:not([value=""])');
            gradeOptions.forEach(opt => opt.remove());
            
            grades.forEach(grade => {
                const option = document.createElement('option');
                option.value = grade.id;
                option.textContent = grade.name;
                gradeSelect.appendChild(option);
            });
            
            // Populate grade dropdown in modal
            const modalGradeSelect = document.getElementById('subject-grade');
            const modalOptions = modalGradeSelect.querySelectorAll('option:not([value=""])');
            modalOptions.forEach(opt => opt.remove());
            
            grades.forEach(grade => {
                const option = document.createElement('option');
                option.value = grade.id;
                option.textContent = grade.name;
                modalGradeSelect.appendChild(option);
            });
        }

        // ============================================
        // FILTER SUBJECTS
        // ============================================
        document.getElementById('filter-grade').addEventListener('change', filterSubjects);
        document.getElementById('filter-status').addEventListener('change', filterSubjects);
        document.getElementById('search-input').addEventListener('input', filterSubjects);

        function filterSubjects() {
            const gradeFilter = document.getElementById('filter-grade').value;
            const statusFilter = document.getElementById('filter-status').value;
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            
            let filtered = [...subjects];
            
            if (gradeFilter) {
                filtered = filtered.filter(s => s.grade_id === gradeFilter);
            }
            
            if (statusFilter) {
                const enrollment = enrollments.find(e => e.subject_id === s.id);
                filtered = filtered.filter(s => {
                    const enrollment = enrollments.find(e => e.subject_id === s.id);
                    const status = enrollment?.status || 'not_enrolled';
                    return status === statusFilter;
                });
            }
            
            if (searchTerm) {
                filtered = filtered.filter(s => 
                    s.name.toLowerCase().includes(searchTerm) ||
                    s.code.toLowerCase().includes(searchTerm) ||
                    (s.description && s.description.toLowerCase().includes(searchTerm))
                );
            }
            
            // Re-render with filtered subjects
            const originalSubjects = subjects;
            subjects = filtered;
            renderSubjects();
            subjects = originalSubjects;
        }

        // ============================================
        // VIEW SUBJECT
        // ============================================
        function viewSubject(subjectId) {
            const subject = subjects.find(s => s.id === subjectId);
            if (!subject) {
                showToast('Subject not found', 'error');
                return;
            }
            
            showToast(`Viewing: ${subject.name}`, 'info');
            // Could navigate to subject detail page or open modal
        }

        // ============================================
        // OPEN ADD SUBJECT MODAL
        // ============================================
        function openAddSubjectModal() {
            if (userRole === 'learner') {
                showToast('Only teachers and admins can create subjects', 'warning');
                return;
            }
            
            document.getElementById('modal-title').textContent = 'Add New Subject';
            document.getElementById('edit-subject-id').value = '';
            document.getElementById('subject-name').value = '';
            document.getElementById('subject-code').value = '';
            document.getElementById('subject-description').value = '';
            document.getElementById('subject-color').value = '#2563EB';
            document.getElementById('subject-grade').value = '';
            document.getElementById('save-subject-btn').innerHTML = '<i class="fas fa-save mr-2"></i> Save Subject';
            
            document.getElementById('subject-modal').classList.add('active');
        }

        // ============================================
        // EDIT SUBJECT
        // ============================================
        function editSubject(subjectId) {
            if (userRole === 'learner') {
                showToast('Only teachers and admins can edit subjects', 'warning');
                return;
            }
            
            const subject = subjects.find(s => s.id === subjectId);
            if (!subject) {
                showToast('Subject not found', 'error');
                return;
            }
            
            document.getElementById('modal-title').textContent = 'Edit Subject';
            document.getElementById('edit-subject-id').value = subject.id;
            document.getElementById('subject-name').value = subject.name;
            document.getElementById('subject-code').value = subject.code;
            document.getElementById('subject-description').value = subject.description || '';
            document.getElementById('subject-color').value = subject.color || '#2563EB';
            document.getElementById('subject-grade').value = subject.grade_id || '';
            document.getElementById('save-subject-btn').innerHTML = '<i class="fas fa-save mr-2"></i> Update Subject';
            
            document.getElementById('subject-modal').classList.add('active');
        }

        // ============================================
        // CLOSE MODAL
        // ============================================
        function closeModal() {
            document.getElementById('subject-modal').classList.remove('active');
        }

        // ============================================
        // SAVE SUBJECT
        // ============================================
        document.getElementById('subject-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const editId = document.getElementById('edit-subject-id').value;
            const name = document.getElementById('subject-name').value.trim();
            const code = document.getElementById('subject-code').value.trim().toUpperCase();
            const description = document.getElementById('subject-description').value.trim();
            const gradeId = document.getElementById('subject-grade').value;
            const color = document.getElementById('subject-color').value;
            
            if (!name || !code || !gradeId) {
                showToast('Please fill in all required fields', 'warning');
                return;
            }
            
            const btn = document.getElementById('save-subject-btn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner spinner mr-2"></i> Saving...';
            
            try {
                const subjectData = {
                    name,
                    code,
                    description,
                    grade_id: gradeId,
                    color,
                    teacher_id: currentUser.id
                };
                
                let result;
                
                if (editId) {
                    // Update existing subject
                    const { data, error } = await supabaseClient
                        .from('subjects')
                        .update(subjectData)
                        .eq('id', editId)
                        .select();
                    
                    if (error) throw error;
                    result = data;
                    showToast('Subject updated successfully! ✅', 'success');
                } else {
                    // Create new subject
                    const { data, error } = await supabaseClient
                        .from('subjects')
                        .insert([subjectData])
                        .select();
                    
                    if (error) throw error;
                    result = data;
                    showToast('Subject created successfully! 🎉', 'success');
                }
                
                closeModal();
                await loadData();
                
            } catch (error) {
                console.error('Error saving subject:', error);
                showToast('Error saving subject: ' + error.message, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-save mr-2"></i> Save Subject';
            }
        });

        // ============================================
        // DELETE SUBJECT
        // ============================================
        async function deleteSubject(subjectId) {
            if (userRole === 'learner') {
                showToast('Only teachers and admins can delete subjects', 'warning');
                return;
            }
            
            const subject = subjects.find(s => s.id === subjectId);
            if (!subject) {
                showToast('Subject not found', 'error');
                return;
            }
            
            if (!confirm(`Are you sure you want to delete "${subject.name}"? This action cannot be undone.`)) {
                return;
            }
            
            try {
                const { error } = await supabaseClient
                    .from('subjects')
                    .delete()
                    .eq('id', subjectId);
                
                if (error) throw error;
                
                showToast('Subject deleted successfully', 'success');
                await loadData();
                
            } catch (error) {
                console.error('Error deleting subject:', error);
                showToast('Error deleting subject: ' + error.message, 'error');
            }
        }

        // ============================================
        // DARK MODE
        // ============================================
        function toggleDarkMode() {
            const html = document.documentElement;
            const isDark = html.classList.toggle('dark');
            localStorage.setItem('darkMode', isDark ? 'true' : 'false');
            updateDarkModeIcon(isDark);
        }

        function updateDarkModeIcon(isDark) {
            const icon = document.getElementById('dark-mode-icon');
            icon.className = isDark ? 'fas fa-sun' : 'fas fa-moon';
        }

        function initDarkMode() {
            const saved = localStorage.getItem('darkMode');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const isDark = saved ? saved === 'true' : prefersDark;
            if (isDark) {
                document.documentElement.classList.add('dark');
                updateDarkModeIcon(true);
            }
        }

        // ============================================
        // CLOSE MODAL ON OVERLAY CLICK
        // ============================================
        document.getElementById('subject-modal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        // ============================================
        // KEYBOARD SHORTCUTS
        // ============================================
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
            }
        });

        // ============================================
        // INITIALIZATION
        // ============================================
        (async function init() {
            console.log('🚀 CastroEduConnect Subjects Page Loading...');
            
            // Init dark mode
            initDarkMode();
            
            // Setup dark mode toggle
            document.getElementById('dark-mode-toggle').addEventListener('click', toggleDarkMode);
            
            // Check authentication
            const isAuth = await checkAuth();
            
            if (!isAuth) {
                console.log('❌ Not authenticated, redirecting...');
                window.location.href = 'login.html';
                return;
            }
            
            console.log('✅ Subjects page initialized successfully');
        })();
    </script>
</body>
</html>
