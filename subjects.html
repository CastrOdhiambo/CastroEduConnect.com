<!DOCTYPE html>

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        .sidebar-link {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            color: #6b7280;
            transition: all 0.3s ease;
            cursor: pointer;
            text-decoration: none;
        }
        .sidebar-link:hover {
            background: rgba(37, 99, 235, 0.1);
            color: #2563EB;
        }
        .sidebar-link.active {
            background: linear-gradient(135deg, #2563EB, #4F46E5);
            color: white;
        }
        .dark .sidebar-link {
            color: #9ca3af;
        }
        .dark .sidebar-link:hover {
            background: rgba(37, 99, 235, 0.2);
            color: #60a5fa;
        }
        
        .gradient-bg {
            background: linear-gradient(135deg, #2563EB 0%, #4F46E5 50%, #7C3AED 100%);
        }
        
        .subject-card {
            background: white;
            border-radius: 1.5rem;
            padding: 1.5rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
            border-left: 4px solid #2563EB;
            position: relative;
            overflow: hidden;
        }
        .subject-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 30px rgba(37, 99, 235, 0.15);
        }
        .dark .subject-card {
            background: #1a1a2e;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        
        .spinner {
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .toast-container {
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .toast {
            padding: 1rem 1.5rem;
            border-radius: 0.75rem;
            color: white;
            animation: slideInRight 0.5s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            min-width: 300px;
            max-width: 450px;
        }
        .toast-success { background: #10B981; }
        .toast-error { background: #EF4444; }
        .toast-warning { background: #F59E0B; }
        .toast-info { background: #3B82F6; }
        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 9998;
            display: none;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-content {
            background: white;
            border-radius: 2rem;
            padding: 2rem;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            animation: modalPop 0.3s ease;
        }
        .dark .modal-content {
            background: #1a1a2e;
        }
        @keyframes modalPop {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        
        .skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: skeleton-loading 1.5s ease-in-out infinite;
            border-radius: 0.75rem;
        }
        @keyframes skeleton-loading {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .dark .skeleton {
            background: linear-gradient(90deg, #1a1a2e 25%, #2a2a3e 50%, #1a1a2e 75%);
            background-size: 200% 100%;
        }
        
        .form-input-error {
            border-color: #EF4444 !important;
        }
        .form-input-error:focus {
            border-color: #EF4444 !important;
            ring-color: #EF4444 !important;
        }
        .form-error-message {
            color: #EF4444;
            font-size: 0.75rem;
            margin-top: 0.25rem;
            display: none;
        }
        .form-error-message.show {
            display: block;
        }
    </style>
</head>

    <!-- Main Content -->

    <script>
        // ============================================
        // SUPABASE CONFIGURATION
        // ============================================
        const SUPABASE_URL = 'https://kfeqmjveemfacrmqrhzk.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_p5OiC1XnOlBLKs2nUYAL1w_LBBh5kDo';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        console.log('✅ Supabase client initialized');

        // ============================================
        // GRADES DATA - Complete list with proper UUIDs
        // Grade 1-12 and Form 1-4
        // ============================================
        const GRADES_DATA = [
            { id: 'a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d', name: 'Grade 1', code: 'G1', sort_order: 1 },
            { id: 'b2c3d4e5-f6a7-4b8c-9d0e-1f2a3b4c5d6e', name: 'Grade 2', code: 'G2', sort_order: 2 },
            { id: 'c3d4e5f6-a7b8-4c9d-0e1f-2a3b4c5d6e7f', name: 'Grade 3', code: 'G3', sort_order: 3 },
            { id: 'd4e5f6a7-b8c9-4d0e-1f2a-3b4c5d6e7f8a', name: 'Grade 4', code: 'G4', sort_order: 4 },
            { id: 'e5f6a7b8-c9d0-4e1f-2a3b-4c5d6e7f8a9b', name: 'Grade 5', code: 'G5', sort_order: 5 },
            { id: 'f6a7b8c9-d0e1-4f2a-3b4c-5d6e7f8a9b0c', name: 'Grade 6', code: 'G6', sort_order: 6 },
            { id: 'a7b8c9d0-e1f2-4a3b-4c5d-6e7f8a9b0c1d', name: 'Grade 7', code: 'G7', sort_order: 7 },
            { id: 'b8c9d0e1-f2a3-4b4c-5d6e-7f8a9b0c1d2e', name: 'Grade 8', code: 'G8', sort_order: 8 },
            { id: 'c9d0e1f2-a3b4-4c5d-6e7f-8a9b0c1d2e3f', name: 'Grade 9', code: 'G9', sort_order: 9 },
            { id: 'd0e1f2a3-b4c5-4d6e-7f8a-9b0c1d2e3f4a', name: 'Grade 10', code: 'G10', sort_order: 10 },
            { id: 'e1f2a3b4-c5d6-4e7f-8a9b-0c1d2e3f4a5b', name: 'Grade 11', code: 'G11', sort_order: 11 },
            { id: 'f2a3b4c5-d6e7-4f8a-9b0c-1d2e3f4a5b6c', name: 'Grade 12', code: 'G12', sort_order: 12 },
            { id: 'a3b4c5d6-e7f8-4a9b-0c1d-2e3f4a5b6c7d', name: 'Form 1', code: 'F1', sort_order: 13 },
            { id: 'b4c5d6e7-f8a9-4b0c-1d2e-3f4a5b6c7d8e', name: 'Form 2', code: 'F2', sort_order: 14 },
            { id: 'c5d6e7f8-a9b0-4c1d-2e3f-4a5b6c7d8e9f', name: 'Form 3', code: 'F3', sort_order: 15 },
            { id: 'd6e7f8a9-b0c1-4d2e-3f4a-5b6c7d8e9f0a', name: 'Form 4', code: 'F4', sort_order: 16 }
        ];

        // ============================================
        // STATE
        // ============================================
        let currentUser = null;
        let userProfile = null;
        let userRole = 'learner';
        let subjects = [];
        let grades = [];
        let enrollments = [];
        let filteredSubjects = [];

        // ============================================
        // TOAST NOTIFICATIONS
        // ============================================
        function showToast(message, type = 'info', duration = 3000) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.innerHTML = `
                <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-2">
                        ${type === 'success' ? '<i class="fas fa-check-circle"></i>' : ''}
                        ${type === 'error' ? '<i class="fas fa-exclamation-circle"></i>' : ''}
                        ${type === 'warning' ? '<i class="fas fa-exclamation-triangle"></i>' : ''}
                        ${type === 'info' ? '<i class="fas fa-info-circle"></i>' : ''}
                        <span>${message}</span>
                    </div>
                    <button onclick="this.parentElement.parentElement.remove()" class="text-white/80 hover:text-white">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            `;
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(100%)';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, duration);
        }

        // ============================================
        // SIDEBAR TOGGLE
        // ============================================
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('-translate-x-full');
        }

        // ============================================
        // LOGOUT
        // ============================================
        async function logoutUser() {
            try {
                const { error } = await supabaseClient.auth.signOut();
                if (error) throw error;
                
                showToast('Logged out successfully!', 'success');
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1000);
            } catch (error) {
                console.error('Logout error:', error);
                showToast('Error logging out: ' + error.message, 'error');
            }
        }

        // ============================================
        // CHECK AUTHENTICATION
        // ============================================
        async function checkAuth() {
            try {
                const { data: { session }, error } = await supabaseClient.auth.getSession();
                
                if (error) throw error;
                
                if (!session) {
                    console.log('No session found, redirecting to login');
                    window.location.href = 'login.html';
                    return false;
                }
                
                currentUser = session.user;
                console.log('✅ User authenticated:', currentUser.email);
                
                await fetchUserProfile();
                updateUserUI();
                await loadData();
                
                return true;
            } catch (error) {
                console.error('Auth check error:', error);
                window.location.href = 'login.html';
                return false;
            }
        }

        // ============================================
        // FETCH USER PROFILE
        // ============================================
        async function fetchUserProfile() {
            try {
                const { data, error } = await supabaseClient
                    .from('profiles')
                    .select('*')
                    .eq('id', currentUser.id)
                    .single();
                
                if (error) throw error;
                
                userProfile = data;
                userRole = data.role || 'learner';
                console.log('👤 User profile loaded:', userProfile);
                
                return userProfile;
            } catch (error) {
                console.error('Error fetching profile:', error);
                userProfile = {
                    first_name: currentUser.user_metadata?.first_name || 'User',
                    last_name: currentUser.user_metadata?.last_name || '',
                    role: currentUser.user_metadata?.role || 'learner'
                };
                userRole = userProfile.role;
                return userProfile;
            }
        }

        // ============================================
        // UPDATE UI WITH USER INFO
        // ============================================
        function updateUserUI() {
            const firstName = userProfile?.first_name || currentUser?.user_metadata?.first_name || 'User';
            const lastName = userProfile?.last_name || currentUser?.user_metadata?.last_name || '';
            const fullName = `${firstName} ${lastName}`.trim();
            
            document.getElementById('user-name').textContent = fullName || currentUser.email;
            const roleDisplay = userRole.charAt(0).toUpperCase() + userRole.slice(1);
            document.getElementById('user-role').textContent = roleDisplay;
            
            const initials = firstName.charAt(0) + (lastName ? lastName.charAt(0) : '');
            document.getElementById('user-avatar').innerHTML = initials || '<i class="fas fa-user"></i>';
            
            // Show/hide add button based on role
            if (userRole === 'teacher' || userRole === 'admin') {
                document.getElementById('add-subject-btn').classList.remove('hidden');
            }
        }

        // ============================================
        // LOAD DATA
        // ============================================
        async function loadData() {
            try {
                await loadGrades();
                await loadSubjects();
                await loadEnrollments();
                populateFilters();
                applyFilters();
            } catch (error) {
                console.error('Error loading data:', error);
                showToast('Error loading subjects data', 'error');
            }
        }

        // ============================================
        // LOAD GRADES - Seed if empty
        // ============================================
        async function loadGrades() {
            try {
                // First, try to fetch grades from database
                const { data, error } = await supabaseClient
                    .from('grades')
                    .select('*')
                    .order('sort_order', { ascending: true });
                
                if (error) {
                    console.error('Error fetching grades:', error);
                    // Use predefined grades
                    grades = GRADES_DATA;
                    populateGradeDropdowns();
                    return grades;
                }
                
                if (!data || data.length === 0) {
                    console.log('No grades in database, seeding all grades...');
                    
                    // Insert all grades
                    for (const grade of GRADES_DATA) {
                        const { error: insertError } = await supabaseClient
                            .from('grades')
                            .insert({
                                id: grade.id,
                                name: grade.name,
                                code: grade.code,
                                sort_order: grade.sort_order,
                                is_active: true
                            });
                        
                        if (insertError) {
                            console.error('Error inserting grade:', insertError);
                        }
                    }
                    
                    // Fetch the inserted grades
                    const { data: seededData, error: fetchError } = await supabaseClient
                        .from('grades')
                        .select('*')
                        .order('sort_order', { ascending: true });
                    
                    if (fetchError) {
                        console.error('Error fetching seeded grades:', fetchError);
                        grades = GRADES_DATA;
                    } else {
                        grades = seededData || GRADES_DATA;
                    }
                } else {
                    grades = data;
                }
                
                console.log('📚 Grades loaded:', grades.length);
                populateGradeDropdowns();
                return grades;
            } catch (error) {
                console.error('Error in loadGrades:', error);
                grades = GRADES_DATA;
                populateGradeDropdowns();
                return grades;
            }
        }

        // ============================================
        // POPULATE GRADE DROPDOWNS
        // ============================================
        function populateGradeDropdowns() {
            const selectors = ['subject-grade', 'filter-grade'];
            
            selectors.forEach(selectorId => {
                const select = document.getElementById(selectorId);
                if (!select) {
                    console.warn('Select element not found:', selectorId);
                    return;
                }
                
                // Clear existing options (keep first option if it's placeholder)
                while (select.options.length > 1) {
                    select.remove(1);
                }
                
                // Add grade options
                grades.forEach(grade => {
                    const option = document.createElement('option');
                    option.value = grade.id;
                    option.textContent = grade.name;
                    select.appendChild(option);
                });
            });
        }

        // ============================================
        // LOAD SUBJECTS
        // ============================================
        async function loadSubjects() {
            try {
                let query = supabaseClient
                    .from('subjects')
                    .select(`
                        *,
                        grades (id, name, code),
                        profiles (id, first_name, last_name)
                    `);
                
                // If learner, only show enrolled subjects
                if (userRole === 'learner') {
                    const { data: enrolls, error: enrollError } = await supabaseClient
                        .from('subject_enrollments')
                        .select('subject_id')
                        .eq('learner_id', currentUser.id)
                        .eq('status', 'active');
                    
                    if (enrollError) throw enrollError;
                    
                    const subjectIds = enrolls?.map(e => e.subject_id) || [];
                    if (subjectIds.length > 0) {
                        query = query.in('id', subjectIds);
                    } else {
                        subjects = [];
                        return;
                    }
                }
                
                const { data, error } = await query;
                
                if (error) throw error;
                subjects = data || [];
                console.log('📖 Subjects loaded:', subjects.length);
                return subjects;
            } catch (error) {
                console.error('Error loading subjects:', error);
                subjects = [];
                return [];
            }
        }

        // ============================================
        // LOAD ENROLLMENTS
        // ============================================
        async function loadEnrollments() {
            try {
                const { data, error } = await supabaseClient
                    .from('subject_enrollments')
                    .select('*')
                    .eq('learner_id', currentUser.id);
                
                if (error) throw error;
                enrollments = data || [];
                return enrollments;
            } catch (error) {
                console.error('Error loading enrollments:', error);
                enrollments = [];
                return [];
            }
        }

        // ============================================
        // POPULATE FILTERS
        // ============================================
        function populateFilters() {
            // Grade filter is populated by populateGradeDropdowns
        }

        // ============================================
        // APPLY FILTERS
        // ============================================
        document.getElementById('filter-grade').addEventListener('change', applyFilters);
        document.getElementById('filter-status').addEventListener('change', applyFilters);
        document.getElementById('search-input').addEventListener('input', applyFilters);

        function applyFilters() {
            const gradeFilter = document.getElementById('filter-grade').value;
            const statusFilter = document.getElementById('filter-status').value;
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            
            filteredSubjects = [...subjects];
            
            if (gradeFilter) {
                filteredSubjects = filteredSubjects.filter(s => s.grade_id === gradeFilter);
            }
            
            if (statusFilter) {
                filteredSubjects = filteredSubjects.filter(s => {
                    const enrollment = enrollments.find(e => e.subject_id === s.id);
                    const status = enrollment?.status || 'not_enrolled';
                    return status === statusFilter;
                });
            }
            
            if (searchTerm) {
                filteredSubjects = filteredSubjects.filter(s => 
                    s.name.toLowerCase().includes(searchTerm) ||
                    s.code.toLowerCase().includes(searchTerm) ||
                    (s.description && s.description.toLowerCase().includes(searchTerm))
                );
            }
            
            renderSubjects();
        }

        // ============================================
        // RENDER SUBJECTS
        // ============================================
        function renderSubjects() {
            const container = document.getElementById('subjects-container');
            
            if (!filteredSubjects || filteredSubjects.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full text-center py-12">
                        <i class="fas fa-book-open text-6xl text-gray-300 dark:text-gray-600 mb-4"></i>
                        <h3 class="text-xl font-semibold text-gray-900 dark:text-white">No Subjects Found</h3>
                        <p class="text-gray-500 dark:text-gray-400 mt-2">
                            ${userRole === 'learner' ? 'You are not enrolled in any subjects yet.' : 'No subjects have been created yet.'}
                        </p>
                        ${userRole !== 'learner' ? `
                            <button onclick="openAddSubjectModal()" class="mt-4 btn-primary px-6 py-2 rounded-xl text-white font-semibold">
                                <i class="fas fa-plus mr-2"></i> Create First Subject
                            </button>
                        ` : ''}
                    </div>
                `;
                return;
            }
            
            container.innerHTML = filteredSubjects.map(subject => {
                const grade = subject.grades;
                const teacher = subject.profiles;
                const gradeName = grade?.name || 'No Grade';
                const teacherName = teacher?.first_name && teacher?.last_name 
                    ? `${teacher.first_name} ${teacher.last_name}`
                    : 'No teacher assigned';
                
                // Find enrollment status
                const enrollment = enrollments.find(e => e.subject_id === subject.id);
                const status = enrollment?.status || 'not_enrolled';
                const statusColors = {
                    'active': 'bg-green-100 dark:bg-green-900/30 text-green-600 dark:text-green-400',
                    'completed': 'bg-blue-100 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400',
                    'dropped': 'bg-red-100 dark:bg-red-900/30 text-red-600 dark:text-red-400',
                    'not_enrolled': 'bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-400'
                };
                const statusLabels = {
                    'active': 'Active',
                    'completed': 'Completed',
                    'dropped': 'Dropped',
                    'not_enrolled': 'Not Enrolled'
                };
                
                return `
                    <div class="subject-card" style="border-left-color: ${subject.color || '#2563EB'}">
                        <div class="flex items-start justify-between mb-4">
                            <div class="flex items-center space-x-3">
                                <div class="w-12 h-12 rounded-xl flex items-center justify-center" 
                                     style="background: ${subject.color || '#2563EB'}20; color: ${subject.color || '#2563EB'}">
                                    <i class="fas fa-book text-2xl"></i>
                                </div>
                                <div>
                                    <h3 class="text-lg font-bold text-gray-900 dark:text-white">${subject.name}</h3>
                                    <p class="text-sm text-gray-500 dark:text-gray-400">${subject.code}</p>
                                </div>
                            </div>
                            <span class="text-xs px-3 py-1 rounded-full ${statusColors[status]}">
                                ${statusLabels[status]}
                            </span>
                        </div>
                        
                        <p class="text-sm text-gray-600 dark:text-gray-400 mb-3">${subject.description || 'No description available'}</p>
                        
                        <div class="flex items-center justify-between text-sm text-gray-500 dark:text-gray-400 mb-3">
                            <span><i class="fas fa-graduation-cap mr-1"></i> ${gradeName}</span>
                            <span><i class="fas fa-user mr-1"></i> ${teacherName}</span>
                        </div>
                        
                        <div class="flex items-center gap-2 mt-2">
                            <button onclick="viewSubject('${subject.id}')" 
                                    class="flex-1 py-2 border border-blue-600 text-blue-600 dark:border-blue-400 dark:text-blue-400 rounded-xl hover:bg-blue-50 dark:hover:bg-blue-900/20 transition font-medium text-sm">
                                <i class="fas fa-eye mr-1"></i> View
                            </button>
                            ${userRole !== 'learner' ? `
                                <button onclick="editSubject('${subject.id}')" 
                                        class="flex-1 py-2 border border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-300 rounded-xl hover:bg-gray-100 dark:hover:bg-gray-700 transition font-medium text-sm">
                                    <i class="fas fa-edit mr-1"></i> Edit
                                </button>
                                <button onclick="deleteSubject('${subject.id}')" 
                                        class="py-2 px-3 border border-red-300 dark:border-red-700 text-red-600 dark:text-red-400 rounded-xl hover:bg-red-50 dark:hover:bg-red-900/20 transition font-medium text-sm">
                                    <i class="fas fa-trash"></i>
                                </button>
                            ` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // ============================================
        // VIEW SUBJECT
        // ============================================
        function viewSubject(subjectId) {
            const subject = subjects.find(s => s.id === subjectId);
            if (!subject) {
                showToast('Subject not found', 'error');
                return;
            }
            
            const grade = subject.grades;
            const teacher = subject.profiles;
            
            const details = `
                <div class="space-y-4">
                    <div class="flex items-center gap-3">
                        <div class="w-16 h-16 rounded-xl flex items-center justify-center" 
                             style="background: ${subject.color || '#2563EB'}20; color: ${subject.color || '#2563EB'}">
                            <i class="fas fa-book text-3xl"></i>
                        </div>
                        <div>
                            <h3 class="text-2xl font-bold text-gray-900 dark:text-white">${subject.name}</h3>
                            <p class="text-sm text-gray-500 dark:text-gray-400">${subject.code}</p>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-4 p-4 bg-gray-50 dark:bg-gray-900/50 rounded-xl">
                        <div>
                            <p class="text-sm text-gray-500 dark:text-gray-400">Grade</p>
                            <p class="font-medium text-gray-900 dark:text-white">${grade?.name || 'N/A'}</p>
                        </div>
                        <div>
                            <p class="text-sm text-gray-500 dark:text-gray-400">Teacher</p>
                            <p class="font-medium text-gray-900 dark:text-white">${teacher?.first_name || 'N/A'} ${teacher?.last_name || ''}</p>
                        </div>
                        <div>
                            <p class="text-sm text-gray-500 dark:text-gray-400">Color</p>
                            <div class="w-8 h-8 rounded-full" style="background: ${subject.color || '#2563EB'}"></div>
                        </div>
                        <div>
                            <p class="text-sm text-gray-500 dark:text-gray-400">Status</p>
                            <p class="font-medium text-gray-900 dark:text-white">${subject.is_active ? 'Active' : 'Inactive'}</p>
                        </div>
                    </div>
                    
                    ${subject.description ? `
                        <div class="p-4 bg-blue-50 dark:bg-blue-900/20 rounded-xl">
                            <h4 class="font-semibold text-gray-900 dark:text-white mb-2">📝 Description</h4>
                            <p class="text-sm text-gray-600 dark:text-gray-400">${subject.description}</p>
                        </div>
                    ` : ''}
                    
                    <button onclick="closeModal()" class="w-full btn-primary py-2 rounded-xl text-white font-semibold">
                        Close
                    </button>
                </div>
            `;
            
            // Show in modal
            document.getElementById('modal-title').textContent = 'Subject Details';
            document.getElementById('subject-form').style.display = 'none';
            const modalBody = document.createElement('div');
            modalBody.id = 'modal-body';
            modalBody.innerHTML = details;
            document.querySelector('.modal-content').appendChild(modalBody);
            document.getElementById('subject-modal').classList.add('active');
        }

        // ============================================
        // OPEN ADD SUBJECT MODAL
        // ============================================
        function openAddSubjectModal() {
            if (userRole === 'learner') {
                showToast('Only teachers and admins can create subjects', 'warning');
                return;
            }
            
            // Reset form
            document.getElementById('modal-title').textContent = 'Add New Subject';
            document.getElementById('edit-subject-id').value = '';
            document.getElementById('subject-name').value = '';
            document.getElementById('subject-code').value = '';
            document.getElementById('subject-description').value = '';
            document.getElementById('subject-color').value = '#2563EB';
            document.getElementById('subject-grade').value = '';
            document.getElementById('save-subject-btn').innerHTML = '<i class="fas fa-save mr-2"></i> Save Subject';
            
            // Remove any existing modal body
            const existingBody = document.getElementById('modal-body');
            if (existingBody) existingBody.remove();
            document.getElementById('subject-form').style.display = 'block';
            
            // Clear errors
            document.querySelectorAll('.form-error-message.show').forEach(el => el.classList.remove('show'));
            document.querySelectorAll('.form-input-error').forEach(el => el.classList.remove('form-input-error'));
            
            document.getElementById('subject-modal').classList.add('active');
        }

        // ============================================
        // EDIT SUBJECT
        // ============================================
        function editSubject(subjectId) {
            if (userRole === 'learner') {
                showToast('Only teachers and admins can edit subjects', 'warning');
                return;
            }
            
            const subject = subjects.find(s => s.id === subjectId);
            if (!subject) {
                showToast('Subject not found', 'error');
                return;
            }
            
            // Remove any existing modal body
            const existingBody = document.getElementById('modal-body');
            if (existingBody) existingBody.remove();
            document.getElementById('subject-form').style.display = 'block';
            
            document.getElementById('modal-title').textContent = 'Edit Subject';
            document.getElementById('edit-subject-id').value = subject.id;
            document.getElementById('subject-name').value = subject.name;
            document.getElementById('subject-code').value = subject.code;
            document.getElementById('subject-description').value = subject.description || '';
            document.getElementById('subject-color').value = subject.color || '#2563EB';
            document.getElementById('subject-grade').value = subject.grade_id || '';
            document.getElementById('save-subject-btn').innerHTML = '<i class="fas fa-save mr-2"></i> Update Subject';
            
            document.getElementById('subject-modal').classList.add('active');
        }

        // ============================================
        // CLOSE MODAL
        // ============================================
        function closeModal() {
            document.getElementById('subject-modal').classList.remove('active');
            // Clean up
            const existingBody = document.getElementById('modal-body');
            if (existingBody) existingBody.remove();
            document.getElementById('subject-form').style.display = 'block';
        }

        // ============================================
        // SAVE SUBJECT
        // ============================================
        document.getElementById('subject-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const editId = document.getElementById('edit-subject-id').value;
            const name = document.getElementById('subject-name').value.trim();
            const code = document.getElementById('subject-code').value.trim().toUpperCase();
            const description = document.getElementById('subject-description').value.trim();
            const gradeId = document.getElementById('subject-grade').value;
            const color = document.getElementById('subject-color').value;
            
            // Reset errors
            document.querySelectorAll('.form-error-message.show').forEach(el => el.classList.remove('show'));
            document.querySelectorAll('.form-input-error').forEach(el => el.classList.remove('form-input-error'));
            
            let isValid = true;
            
            if (!name) {
                document.getElementById('subject-name').classList.add('form-input-error');
                document.getElementById('subject-name-error').classList.add('show');
                isValid = false;
            }
            
            if (!code) {
                document.getElementById('subject-code').classList.add('form-input-error');
                document.getElementById('subject-code-error').classList.add('show');
                isValid = false;
            }
            
            if (!gradeId) {
                document.getElementById('subject-grade').classList.add('form-input-error');
                document.getElementById('subject-grade-error').classList.add('show');
                isValid = false;
            }
            
            if (!isValid) {
                showToast('Please fill in all required fields', 'warning');
                return;
            }
            
            const btn = document.getElementById('save-subject-btn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner spinner mr-2"></i> Saving...';
            
            try {
                const subjectData = {
                    name,
                    code,
                    description,
                    grade_id: gradeId,
                    color,
                    teacher_id: currentUser.id,
                    is_active: true
                };
                
                let result;
                
                if (editId) {
                    // Update existing subject
                    const { data, error } = await supabaseClient
                        .from('subjects')
                        .update(subjectData)
                        .eq('id', editId)
                        .select();
                    
                    if (error) throw error;
                    result = data;
                    showToast('Subject updated successfully! ✅', 'success');
                } else {
                    // Create new subject
                    const { data, error } = await supabaseClient
                        .from('subjects')
                        .insert([subjectData])
                        .select();
                    
                    if (error) throw error;
                    result = data;
                    showToast('Subject created successfully! 🎉', 'success');
                }
                
                closeModal();
                await loadData();
                
            } catch (error) {
                console.error('Error saving subject:', error);
                showToast('Error saving subject: ' + error.message, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-save mr-2"></i> Save Subject';
            }
        });

        // ============================================
        // DELETE SUBJECT
        // ============================================
        async function deleteSubject(subjectId) {
            if (userRole === 'learner') {
                showToast('Only teachers and admins can delete subjects', 'warning');
                return;
            }
            
            const subject = subjects.find(s => s.id === subjectId);
            if (!subject) {
                showToast('Subject not found', 'error');
                return;
            }
            
            if (!confirm(`Are you sure you want to delete "${subject.name}"? This action cannot be undone.`)) {
                return;
            }
            
            try {
                const { error } = await supabaseClient
                    .from('subjects')
                    .delete()
                    .eq('id', subjectId);
                
                if (error) throw error;
                
                showToast('Subject deleted successfully', 'success');
                await loadData();
                
            } catch (error) {
                console.error('Error deleting subject:', error);
                showToast('Error deleting subject: ' + error.message, 'error');
            }
        }

        // ============================================
        // REAL-TIME VALIDATION
        // ============================================
        document.getElementById('subject-name').addEventListener('input', function() {
            if (this.value.trim()) {
                this.classList.remove('form-input-error');
                document.getElementById('subject-name-error').classList.remove('show');
            }
        });
        
        document.getElementById('subject-code').addEventListener('input', function() {
            if (this.value.trim()) {
                this.classList.remove('form-input-error');
                document.getElementById('subject-code-error').classList.remove('show');
            }
        });
        
        document.getElementById('subject-grade').addEventListener('change', function() {
            if (this.value) {
                this.classList.remove('form-input-error');
                document.getElementById('subject-grade-error').classList.remove('show');
            }
        });

        // ============================================
        // DARK MODE
        // ============================================
        function toggleDarkMode() {
            const html = document.documentElement;
            const isDark = html.classList.toggle('dark');
            localStorage.setItem('darkMode', isDark ? 'true' : 'false');
            updateDarkModeIcon(isDark);
        }

        function updateDarkModeIcon(isDark) {
            const icon = document.getElementById('dark-mode-icon');
            icon.className = isDark ? 'fas fa-sun' : 'fas fa-moon';
        }

        function initDarkMode() {
            const saved = localStorage.getItem('darkMode');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const isDark = saved ? saved === 'true' : prefersDark;
            if (isDark) {
                document.documentElement.classList.add('dark');
                updateDarkModeIcon(true);
            }
        }

        // ============================================
        // CLOSE MODAL ON OVERLAY CLICK
        // ============================================
        document.getElementById('subject-modal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        // ============================================
        // KEYBOARD SHORTCUTS
        // ============================================
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
            }
        });

        // ============================================
        // INITIALIZATION
        // ============================================
        (async function init() {
            console.log('🚀 CastroEduConnect Subjects Page Loading...');
            
            // Init dark mode
            initDarkMode();
            
            // Setup dark mode toggle
            document.getElementById('dark-mode-toggle').addEventListener('click', toggleDarkMode);
            
            // Check authentication
            const isAuth = await checkAuth();
            
            if (!isAuth) {
                console.log('❌ Not authenticated, redirecting...');
                window.location.href = 'login.html';
                return;
            }
            
            console.log('✅ Subjects page initialized successfully');
        })();
    </script>
</body>
